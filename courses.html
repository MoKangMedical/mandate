<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程体系 — Mandate 帝王学</title>
<meta name="description" content="Mandate 交互式课程体系：100门帝王学课程·逐课解锁·每课含随堂测验和AI帝王对话。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════ RESET & VARIABLES ═══════════════ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#09090b;--bg2:#0f0f13;--bg3:#18181b;
  --card:#1c1c21;--card2:#222228;--card3:#2a2a32;
  --border:#27272a;--border2:#3f3f46;
  --text:#fafafa;--text2:#a1a1aa;--text3:#71717a;
  --gold:#e2b64f;--gold2:#f5d98a;
  --red:#c43a31;--red2:#e85d50;
  --green:#22c55e;--blue:#3b82f6;--purple:#a78bfa;
  --serif:'Noto Serif SC',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --radius:16px;--radius-sm:10px;
}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden}
a{color:inherit;text-decoration:none}img{max-width:100%}

/* ═══════════════ TYPOGRAPHY ═══════════════ */
.serif{font-family:var(--serif)}
h1{font-size:clamp(2.2rem,5vw,3.5rem);font-weight:900;line-height:1.15;letter-spacing:-0.02em}
h2{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:700;line-height:1.25;letter-spacing:-0.01em}
h3{font-size:1.15rem;font-weight:600}
.label{font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:var(--gold)}
.body-lg{font-size:1.125rem;color:var(--text2);line-height:1.8}
.body-sm{font-size:0.875rem;color:var(--text3)}

/* ═══════════════ LAYOUT ═══════════════ */
.container{max-width:1200px;margin:0 auto;padding:0 24px}
.container-sm{max-width:800px;margin:0 auto;padding:0 24px}
.section{padding:100px 0}
.section-sm{padding:60px 0}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:32px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.section{padding:60px 0}}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr)}}

/* ═══════════════ NAV ═══════════════ */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(9,9,11,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);transition:all .3s}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-family:var(--serif);font-size:1.2rem;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:8px}
.nav-logo svg{width:28px;height:28px}
.nav-links{display:flex;gap:28px;align-items:center}
.nav-links a{font-size:0.875rem;color:var(--text2);transition:color .2s;font-weight:500}
.nav-links a:hover,.nav-links a.active{color:var(--gold)}
.nav-cta{background:var(--gold);color:#000;padding:8px 20px;border-radius:8px;font-weight:600;font-size:0.85rem;transition:all .2s}
.nav-cta:hover{background:var(--gold2);transform:translateY(-1px)}
@media(max-width:768px){.nav-links{display:none}}
.hamburger{display:none;cursor:pointer;padding:8px}@media(max-width:768px){.hamburger{display:block}}

/* ═══════════════ PROGRESS BAR ═══════════════ */
.progress-bar{position:fixed;top:64px;left:0;right:0;height:3px;background:var(--border);z-index:99}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .5s ease;width:0%}

/* ═══════════════ SECTION HEADER ═══════════════ */
.section-header{text-align:center;max-width:700px;margin:0 auto 60px}
.section-header .label{margin-bottom:12px}
.section-header h2{margin-bottom:16px}
.section-header p{color:var(--text2);font-size:1.05rem;line-height:1.7}

/* ═══════════════ HERO ═══════════════ */
.hero{text-align:center;padding:100px 0 48px;position:relative}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:radial-gradient(ellipse 80% 60% at 50% 20%,rgba(226,182,79,0.06),transparent 70%),
             radial-gradient(ellipse 60% 40% at 80% 80%,rgba(196,58,49,0.04),transparent 60%)}
.hero>*{position:relative;z-index:1}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(226,182,79,0.1);border:1px solid rgba(226,182,79,0.2);padding:6px 16px;border-radius:100px;font-size:0.8rem;color:var(--gold);margin-bottom:24px}
.hero-badge .dot{width:6px;height:6px;background:var(--gold);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.hero h1{margin-bottom:16px}
.hero h1 .gold{color:var(--gold)}
.hero p{color:var(--text2);font-size:1.1rem;max-width:600px;margin:0 auto;line-height:1.7}

/* ═══════════════ STATS BAR ═══════════════ */
.stats-bar{display:flex;justify-content:center;gap:48px;margin:40px 0 0;padding-top:32px;border-top:1px solid var(--border);flex-wrap:wrap}
.stat-item{text-align:center;min-width:100px}
.stat-num{font-size:2rem;font-weight:800;color:var(--gold)}
.stat-item:nth-child(2) .stat-num{color:var(--red)}
.stat-label{font-size:0.8rem;color:var(--text3);margin-top:4px}
@media(max-width:768px){.stats-bar{gap:24px}.stat-num{font-size:1.4rem}}

/* ═══════════════ MODULE TABS ═══════════════ */
.module-tabs{display:flex;gap:8px;margin-bottom:32px;flex-wrap:wrap;justify-content:center}
.module-tab{padding:8px 20px;border-radius:100px;font-size:0.85rem;font-weight:500;color:var(--text2);background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.module-tab:hover{border-color:var(--border2);color:var(--text)}
.module-tab.active{background:rgba(226,182,79,0.1);border-color:var(--gold);color:var(--gold)}

/* ═══════════════ COURSE GRID (Kangbo Style) ═══════════════ */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.course-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .3s;cursor:pointer;display:flex;flex-direction:column}
.course-card:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,0.3)}
.course-card.current{border-color:var(--gold);box-shadow:0 0 30px rgba(226,182,79,0.1)}
.course-card.completed{border-color:var(--green)}
.course-card.locked{opacity:0.45;cursor:not-allowed;pointer-events:none}
.course-card-header{display:flex;align-items:flex-start;gap:16px;padding:24px 24px 16px}
.course-num{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:900;flex-shrink:0;font-family:var(--serif)}
.course-card:not(.locked):not(.completed) .course-num{background:linear-gradient(135deg,var(--gold),#b8860b);color:#000}
.course-card.completed .course-num{background:var(--green);color:#000}
.course-card.locked .course-num{background:var(--card3);color:var(--text3)}
.course-card-info{flex:1;min-width:0}
.course-card-info h3{font-size:0.95rem;margin-bottom:6px;line-height:1.4}
.course-card-info .desc{font-size:0.8rem;color:var(--text3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.course-card-body{padding:0 24px 20px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.course-tag{font-size:0.7rem;padding:3px 10px;border-radius:6px;background:var(--card3);color:var(--text3);font-weight:500}
.course-tag.core{background:rgba(226,182,79,0.1);color:var(--gold)}
.course-tag.time{background:rgba(59,130,246,0.08);color:var(--blue)}
.course-status{font-size:0.75rem;font-weight:600;margin-left:auto;padding:3px 10px;border-radius:6px}
.course-card.current .course-status{color:var(--gold);background:rgba(226,182,79,0.1)}
.course-card.completed .course-status{color:var(--green);background:rgba(34,197,94,0.08)}
.course-card.locked .course-status{color:var(--text3)}

@media(max-width:768px){
  .course-grid{grid-template-columns:1fr}
  .course-card-header{padding:16px;gap:12px}
  .course-num{width:42px;height:42px;font-size:1.1rem}
  .course-card-body{padding:0 16px 14px}
}

/* ═══════════════ COURSE DETAIL (Expanded) ═══════════════ */
.course-detail-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px)}
.course-detail-overlay.open{display:flex;align-items:flex-start;justify-content:center;padding:80px 16px 40px;overflow-y:auto}
.course-detail{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:860px;max-height:calc(100vh - 120px);overflow:hidden;display:flex;flex-direction:column;animation:slideUp 0.3s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.course-detail-header{display:flex;align-items:flex-start;gap:16px;padding:28px;border-bottom:1px solid var(--border);flex-shrink:0}
.course-detail-header .course-num{width:56px;height:56px;font-size:1.5rem}
.course-detail-info{flex:1}
.course-detail-info h2{font-family:var(--serif);font-size:1.4rem;margin-bottom:8px}
.course-detail-info .desc{color:var(--text2);font-size:0.9rem;line-height:1.6}
.course-detail-close{width:36px;height:36px;border-radius:8px;background:var(--card3);border:none;color:var(--text2);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.course-detail-close:hover{background:var(--red);color:#fff}
.course-detail-body{flex:1;overflow-y:auto;padding:28px}
.course-detail-body::-webkit-scrollbar{width:4px}
.course-detail-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* MARKDOWN */
.md{color:var(--text2);font-size:0.92rem;line-height:1.85}
.md h1{font-family:var(--serif);font-size:1.5rem;color:var(--text);margin:24px 0 12px;font-weight:700}
.md h2{font-size:1.15rem;color:var(--text);margin:20px 0 10px;font-weight:700;border-bottom:1px solid var(--border);padding-bottom:6px}
.md h3{font-size:1rem;color:var(--gold);margin:16px 0 6px;font-weight:600}
.md h4{font-size:0.92rem;color:var(--text);margin:12px 0 6px;font-weight:600}
.md p{margin:8px 0}
.md strong{color:var(--text)}
.md em{color:var(--gold);font-style:italic}
.md blockquote{border-left:3px solid var(--gold);padding:10px 18px;margin:14px 0;background:rgba(226,182,79,0.04);border-radius:0 8px 8px 0}
.md ul,.md ol{padding-left:22px;margin:8px 0}
.md li{margin:4px 0}
.md code{background:var(--card3);padding:1px 5px;border-radius:3px;font-size:0.84rem;color:var(--gold)}
.md hr{border:none;border-top:1px solid var(--border);margin:24px 0}
.md table{width:100%;border-collapse:collapse;margin:12px 0;font-size:0.85rem}
.md th{background:var(--card3);padding:8px 12px;text-align:left;font-weight:600;color:var(--text);border:1px solid var(--border)}
.md td{padding:8px 12px;border:1px solid var(--border)}

/* AUDIO PLAYER */
.audio-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--card3);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:0.8rem;transition:all .2s;margin-bottom:20px}
.audio-btn:hover{background:var(--gold);color:#000;border-color:var(--gold)}
.audio-btn.playing{background:var(--gold);color:#000;border-color:var(--gold);animation:pulse-audio 2s ease-in-out infinite}
.audio-btn.paused{background:var(--card3);color:var(--gold);border-color:var(--gold)}
@keyframes pulse-audio{0%,100%{box-shadow:0 0 0 0 rgba(226,182,79,0.4)}50%{box-shadow:0 0 0 8px rgba(226,182,79,0)}}

/* AUDIO PLAYER (Kangbo Academy Style) */
.audio-player{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:24px;transition:border-color .3s}
.audio-player:hover{border-color:rgba(226,182,79,0.2)}
.audio-label{font-size:0.78rem;color:var(--text3);margin-bottom:2px}
.audio-player audio{width:100%}/* QUIZ */
.quiz-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-top:24px}
.quiz-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.quiz-header h3{font-size:1.05rem;color:var(--gold)}
.quiz-header .badge{font-size:0.7rem;background:var(--gold);color:#000;padding:2px 10px;border-radius:100px;font-weight:700}
.quiz-q{margin-bottom:20px;padding:16px;background:var(--bg3);border-radius:var(--radius-sm);border:1px solid var(--border)}
.quiz-q.answered-correct{border-color:var(--green);background:rgba(34,197,94,0.03)}
.quiz-q.answered-wrong{border-color:var(--red);background:rgba(239,68,68,0.03)}
.quiz-q-num{font-size:0.75rem;color:var(--text3);font-weight:600;margin-bottom:8px}
.quiz-q-text{font-size:0.92rem;color:var(--text);margin-bottom:12px;font-weight:500}
.quiz-opts{display:flex;flex-direction:column;gap:6px}
.quiz-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;font-size:0.86rem;color:var(--text2);user-select:none}
.quiz-opt:hover{border-color:var(--border2);color:var(--text);background:var(--card2)}
.quiz-opt.selected{border-color:var(--blue);color:var(--text);background:rgba(59,130,246,0.06)}
.quiz-opt.correct{border-color:var(--green)!important;color:var(--green)!important;background:rgba(34,197,94,0.08)!important}
.quiz-opt.wrong{border-color:var(--red)!important;color:var(--red)!important;background:rgba(239,68,68,0.06)!important}
.quiz-opt.disabled{pointer-events:none}
.quiz-opt-letter{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0;transition:all .2s}
.quiz-opt.selected .quiz-opt-letter{border-color:var(--blue);color:var(--blue)}
.quiz-opt.correct .quiz-opt-letter{border-color:var(--green);color:#000;background:var(--green)}
.quiz-opt.wrong .quiz-opt-letter{border-color:var(--red);color:#000;background:var(--red)}
.quiz-explain{display:none;margin-top:10px;padding:10px 14px;border-radius:8px;font-size:0.83rem;line-height:1.7}
.quiz-explain.show{display:block}
.quiz-explain.correct-explain{background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.2);color:var(--green)}
.quiz-explain.wrong-explain{background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.2);color:var(--red)}
.quiz-footer{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.quiz-score{font-size:0.9rem;color:var(--text2)}
.quiz-score .num{color:var(--gold);font-weight:700;font-size:1.1rem}

/* BUTTONS */
.btn{padding:10px 22px;border-radius:8px;font-weight:600;font-size:0.88rem;border:none;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--gold);color:#000}
.btn-primary:hover{background:var(--gold2);transform:translateY(-1px)}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border2)}
.btn-secondary:hover{border-color:var(--gold);color:var(--gold)}
.btn-green{background:var(--green);color:#000}
.btn-green:hover{background:#16a34a}

/* CONFETTI */
.confetti-container{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:300;overflow:hidden}
.confetti{position:absolute;width:8px;height:8px;top:-10px;animation:confetti-fall 3s ease-in forwards}
@keyframes confetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* SUCCESS BANNER */
.success-banner{display:none;margin-top:24px;padding:24px;background:linear-gradient(135deg,rgba(34,197,94,0.08),rgba(59,130,246,0.05));border:1px solid rgba(34,197,94,0.15);border-radius:var(--radius);text-align:center}
.success-banner.show{display:block}
.success-banner h4{color:var(--green);margin-bottom:8px}
.success-banner p{color:var(--text2);font-size:0.9rem;margin-bottom:16px}
.success-banner .next-title{color:var(--gold);font-weight:700}

/* LOADING */
.loading{text-align:center;padding:60px 20px;color:var(--text3)}
.loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* EMPTY STATE */
.empty-state{text-align:center;padding:80px 20px;color:var(--text3)}
.empty-state .icon{font-size:3rem;margin-bottom:16px;opacity:0.5}

/* FOOTER (Kangbo Style) */
.footer{border-top:1px solid var(--border);padding:48px 0;text-align:center}
.footer-links{display:flex;justify-content:center;gap:32px;margin-bottom:20px;flex-wrap:wrap}
.footer-links a{font-size:0.85rem;color:var(--text3);transition:color .2s}
.footer-links a:hover{color:var(--gold)}
.footer-copy{font-size:0.8rem;color:var(--text3)}
.footer-disclaimer{font-size:0.75rem;color:var(--text3);max-width:600px;margin:8px auto 0;line-height:1.6}
</style>
</head>

  <div class="nav-inner">

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<!-- HERO (Kangbo Style) -->
<div class="hero">
  <div class="hero-badge"><span class="dot"></span> 交互式学习系统</div>
  <h1>逐课解锁，<span class="gold">测验通过</span>才能继续</h1>

<!-- MODULE TABS -->
<div class="container" style="margin-top:16px">

</div>

</div>

<!-- COURSE DETAIL OVERLAY -->
<div class="course-detail-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="course-detail" id="detailPanel"></div>

<!-- FOOTER (Kangbo Style) -->
<footer class="footer">
  <div class="footer-links">
    <a href="index.html">首页</a>
    <a href="courses.html">全部课程</a>
    <a href="index.html#emperors">帝王录</a>

<script>
/* ═══════════════ STATE ═══════════════ */
const STORAGE_KEY = 'mandate_course_state';
let state = loadState();
let quizAnswers = {};
let allCourses = [];
let activeDetail = null;

function defaultState() {
  return { completed:[], current:0, scores:{}, totalCorrect:0, streak:0 };
}
function loadState() {
  try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); return s && typeof s.current === 'number' ? s : defaultState(); }
  catch(e) { return defaultState(); }
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

/* ═══════════════ LOAD COURSES ═══════════════ */
function loadAllCourses() {
  // Merge in-page courses with COURSES_EXTENDED from courses-data.js
  const merged = [];
  
  // Inline courses 1-6 (defined below) 
  if (typeof COURSES !== 'undefined') merged.push(...COURSES);
  
  // External courses 7-100 from courses-data.js
  if (typeof COURSES_EXTENDED !== 'undefined') {
    COURSES_EXTENDED.forEach(c => {
      // Parse tags from array or string format
      let tags = [];
      if (Array.isArray(c.tags)) {
        tags = c.tags;
      } else if (typeof c.tags === 'string') {
        tags = c.tags.split('|');
      }
      merged.push({
        id: c.id,
        title: c.title,
        desc: c.desc,
        tags: tags,
        content: c.content || '',
        quiz: c.quiz || []
      });
    });
  }
  
  allCourses = merged.sort((a,b) => a.id - b.id);
  
  // Collect modules
  const modules = new Set();
  allCourses.forEach(c => {
    (c.tags||[]).forEach(t => {
      if (t && !t.includes('分钟') && !t.includes('课时')) modules.add(t);
    });
  });
  
  // Build module tabs
  const tabContainer = document.getElementById('moduleTabs');
  modules.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'module-tab';
    btn.textContent = m;
    btn.dataset.module = m;
    btn.onclick = () => filterByModule(m, btn);
    tabContainer.appendChild(btn);
  });
  
  renderGrid();
  updateStats();
}

/* ═══════════════ FILTER ═══════════════ */
function filterByModule(module, btn) {
  document.querySelectorAll('.module-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderGrid(module === 'all' ? null : module);
}

/* ═══════════════ RENDER GRID ═══════════════ */
function renderGrid(moduleFilter) {
  const grid = document.getElementById('courseGrid');
  let courses = allCourses;
  if (moduleFilter) {
    courses = courses.filter(c => (c.tags||[]).some(t => t === moduleFilter));
  }
  
  if (!courses.length) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">📚</div><p>该模块暂无课程</p></div>';
    return;
  }
  
  grid.innerHTML = courses.map((c,i) => {
    const completed = state.completed.includes(c.id);
    const isCurrent = state.current === i && !completed;
    const locked = i > 0 && !state.completed.includes(courses[i-1].id) && !completed;
    let cardClass = 'course-card';
    if (locked) cardClass += ' locked';
    else if (isCurrent) cardClass += ' current';
    else if (completed) cardClass += ' completed';
    
    let statusText = '';
    if (locked) statusText = '🔒 待解锁';
    else if (completed) statusText = '✓ 已完成';
    else if (isCurrent) statusText = '进行中';
    
    const tags = (c.tags||[]).map(t => {
      let cls = 'course-tag';
      if (t.includes('核心') || t.includes('入门') || t.includes('进阶') || t.includes('深度') || t.includes('高级')) cls += ' core';
      if (t.includes('分钟') || t.includes('课时')) cls += ' time';
      return `<span class="${cls}">${t}</span>`;
    }).join('');
    
    return `
      <div class="${cardClass}" id="card-${c.id}" onclick="openDetail(${c.id})">
        <div class="course-card-header">
          <div class="course-num">${c.id}</div>
          <div class="course-card-info">
            <h3>${c.title}</h3>
            <div class="desc">${c.desc}</div>
          </div>
        </div>
        <div class="course-card-body">
          ${tags}
          ${statusText ? `<span class="course-status">${statusText}</span>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

/* ═══════════════ OPEN DETAIL ═══════════════ */
function openDetail(cid) {
  const course = allCourses.find(c => c.id === cid);
  if (!course) return;
  
  // Check if locked
  const idx = allCourses.findIndex(c => c.id === cid);
  if (idx > 0 && !state.completed.includes(allCourses[idx-1].id) && !state.completed.includes(cid)) return;
  
  activeDetail = cid;
  quizAnswers[cid] = quizAnswers[cid] || {};
  
  const panel = document.getElementById('detailPanel');
  const content = course.content ? renderMarkdown(course.content) : '<p style="color:var(--text3)">课程内容加载中...</p>';
  
  panel.innerHTML = `
    <div class="course-detail-header">
      <div class="course-num" style="background:linear-gradient(135deg,var(--gold),#b8860b);color:#000">${course.id}</div>
      <div class="course-detail-info">
        <h2>${course.title}</h2>
        <div class="desc">${course.desc}</div>
        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
          ${(course.tags||[]).map(t => `<span class="course-tag ${t.includes('核心')||t.includes('入门')?'core':t.includes('分钟')?'time':''}">${t}</span>`).join('')}
        </div>
      </div>
      <button class="course-detail-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="course-detail-body">
      <div class="audio-player">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:1.4rem">🎙️</span>
          <div style="flex:1;min-width:0">
            <div class="audio-label">课程音频 · 温暖浑厚男声</div>
            <audio controls preload="none" style="width:100%;height:32px;filter:sepia(100%) saturate(300%) hue-rotate(350deg)">
              <source src="audio/lesson${course.id}.mp3" type="audio/mpeg">
            </audio>
          </div>
        </div>
      </div>
      <div class="md">${content}</div>
      ${renderQuiz(course)}
    </div>
  `;
  
  document.getElementById('detailOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  document.body.style.overflow = '';
  activeDetail = null;
  renderGrid();
  updateStats();
}

/* ═══════════════ MARKDOWN RENDER ═══════════════ */
function renderMarkdown(md) {
  if (!md) return '';
  return md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^#### (.+)$/gm,'<h4>$1</h4>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>')
    .replace(/^(\d+)\. (.+)$/gm,'<li>$2</li>')
    .replace(/\n{2,}/g,'</p><p>')
    .replace(/^(?!<[hublocqtu])(.+)$/gm,'<p>$1</p>')
    .replace(/<p><\/p>/g,'')
    .replace(/<\/ul>\s*<p>/g,'</ul>')
    .replace(/<p>\s*<ul>/g,'<ul>')
    .replace(/---/g,'<hr>')
    .replace(/\\n/g,'\n');
}

/* ═══════════════ QUIZ ═══════════════ */
function renderQuiz(course) {
  if (!course.quiz || !course.quiz.length) {
    // Show pass button for courses without quiz
    if (!state.completed.includes(course.id)) {
      return `<div class="quiz-section" style="text-align:center">
        <p style="color:var(--text2);margin-bottom:16px">本课程为阅读材料，无测验。</p>
        <button class="btn btn-primary" onclick="markComplete(${course.id})">✓ 标记为已完成</button>
      </div>`;
    }
    return '<div class="quiz-section" style="text-align:center"><p style="color:var(--green)">✓ 已完成</p></div>';
  }
  
  const answers = quizAnswers[course.id] || {};
  const score = state.scores[course.id];
  const passed = state.completed.includes(course.id);
  
  let html = '<div class="quiz-section">';
  html += '<div class="quiz-header"><h3>📝 随堂测验</h3><span class="badge">' + course.quiz.length + '题</span></div>';
  
  course.quiz.forEach((q, qi) => {
    const answered = answers[qi] !== undefined;
    const correct = answered && answers[qi] === q.answer;
    const wrong = answered && answers[qi] !== q.answer;
    let qClass = '';
    if (correct) qClass = ' answered-correct';
    else if (wrong) qClass = ' answered-wrong';
    
    html += `<div class="quiz-q${qClass}" id="quizQ-${course.id}-${qi}">
      <div class="quiz-q-num">第 ${qi+1}/${course.quiz.length} 题</div>
      <div class="quiz-q-text">${q.q}</div>
      <div class="quiz-opts">`;
    
    q.opts.forEach((opt, oi) => {
      let oClass = 'quiz-opt';
      if (answered) oClass += ' disabled';
      if (answered && oi === answers[qi]) oClass += ' selected';
      if (passed && oi === q.answer) oClass += ' correct';
      if ((passed || wrong) && oi === answers[qi] && oi !== q.answer) oClass += ' wrong';
      
      html += `<div class="${oClass}" onclick="${answered?'':'selectAnswer('+course.id+','+qi+','+oi+')'}">
        <span class="quiz-opt-letter">${'ABCD'[oi]}</span>
        <span>${opt}</span>
      </div>`;
    });
    
    html += '</div>';
    
    if (wrong && q.explain) {
      html += `<div class="quiz-explain wrong-explain show">${q.explain}</div>`;
    } else if (passed && q.explain) {
      html += `<div class="quiz-explain correct-explain show">${q.explain}</div>`;
    }
    
    html += '</div>';
  });
  
  if (passed) {
    html += `<div class="quiz-footer">
      <div class="quiz-score">得分：<span class="num">${score.correct}/${score.total}</span> (${Math.round(score.correct/score.total*100)}%)</div>
      <button class="btn btn-secondary" onclick="retakeQuiz(${course.id})">🔄 重新作答</button>
    </div>`;
  } else {
    const answeredCount = Object.keys(answers).length;
    html += `<div class="quiz-footer">
      <div class="quiz-score">已答：<span class="num">${answeredCount}</span>/${course.quiz.length}</div>
      <button class="btn btn-primary" id="submitBtn-${course.id}" onclick="submitQuiz(${course.id})" ${answeredCount < course.quiz.length ? 'disabled' : ''}>提交答案</button>
    </div>`;
  }
  
  html += '</div>';
  return html;
}

/* ═══════════════ QUIZ ACTIONS ═══════════════ */
function selectAnswer(cid, qi, oi) {
  quizAnswers[cid] = quizAnswers[cid] || {};
  quizAnswers[cid][qi] = oi;
  
  // Enable submit if all answered
  const course = allCourses.find(c => c.id === cid);
  if (course && Object.keys(quizAnswers[cid]).length >= course.quiz.length) {
    const btn = document.getElementById('submitBtn-'+cid);
    if (btn) btn.disabled = false;
  }
  
  // Refresh the quiz section
  refreshDetailQuiz(cid);
}

function submitQuiz(cid) {
  const course = allCourses.find(c => c.id === cid);
  if (!course) return;
  
  const answers = quizAnswers[cid] || {};
  let correct = 0;
  course.quiz.forEach((q, qi) => {
    if (answers[qi] === q.answer) correct++;
  });
  
  const total = course.quiz.length;
  const passed = correct / total >= 0.6;
  
  state.scores[cid] = { correct, total };
  if (passed) {
    if (!state.completed.includes(cid)) {
      state.completed.push(cid);
      state.totalCorrect += correct;
      // Update streak
      state.streak++;
      // Update current
      const idx = allCourses.findIndex(c => c.id === cid);
      if (idx >= 0 && idx < allCourses.length - 1) state.current = idx + 1;
    }
    showConfetti();
  } else {
    state.streak = 0;
  }
  
  saveState();
  refreshDetailQuiz(cid);
  updateStats();
}

function retakeQuiz(cid) {
  delete quizAnswers[cid];
  delete state.scores[cid];
  state.completed = state.completed.filter(x => x !== cid);
  saveState();
  refreshDetailQuiz(cid);
  updateStats();
}

function markComplete(cid) {
  if (!state.completed.includes(cid)) {
    state.completed.push(cid);
    const idx = allCourses.findIndex(c => c.id === cid);
    if (idx >= 0 && idx < allCourses.length - 1) state.current = idx + 1;
    state.streak++;
    showConfetti();
  }
  saveState();
  refreshDetailQuiz(cid);
  updateStats();
}

function refreshDetailQuiz(cid) {
  const course = allCourses.find(c => c.id === cid);
  if (!course) return;
  const body = document.querySelector('.course-detail-body');
  if (!body) return;
  
  // Update only the quiz section
  const quizSection = body.querySelector('.quiz-section');
  const temp = document.createElement('div');
  temp.innerHTML = renderQuiz(course);
  const newQuiz = temp.querySelector('.quiz-section');
  if (quizSection && newQuiz) {
    quizSection.outerHTML = newQuiz.outerHTML;
  }
}

/* ═══════════════ STATS ═══════════════ */
function updateStats() {
  document.getElementById('statCompleted').textContent = state.completed.length;
  document.getElementById('statTotal').textContent = allCourses.length;
  document.getElementById('statScore').textContent = state.totalCorrect;
  document.getElementById('statStreak').textContent = state.streak;
  document.getElementById('progressFill').style.width = (state.completed.length / Math.max(allCourses.length, 1) * 100) + '%';
}

/* ═══════════════ CONFETTI ═══════════════ */
function showConfetti() {
  const box = document.getElementById('confettiBox');
  const colors = ['#e2b64f','#c43a31','#22c55e','#3b82f6','#a78bfa','#f59e0b'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + '%';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDelay = Math.random() * 2 + 's';
    el.style.animationDuration = (2 + Math.random() * 2) + 's';
    box.appendChild(el);
  }
  setTimeout(() => box.innerHTML = '', 4000);
}

/* ═══════════════ TTS AUDIO ═══════════════ */
let audioState = { currentId: null, utterance: null, paused: false };
function toggleAudio(cid) {
  const btn = document.getElementById('audioBtn-' + cid);
  if (audioState.currentId === cid && audioState.utterance) {
    if (audioState.paused) {
      window.speechSynthesis.resume();
      audioState.paused = false;
      if (btn) { btn.className = 'audio-btn playing'; btn.innerHTML = '⏸ 暂停'; }
    } else {
      window.speechSynthesis.pause();
      audioState.paused = true;
      if (btn) { btn.className = 'audio-btn paused'; btn.innerHTML = '▶ 继续'; }
    }
    return;
  }
  window.speechSynthesis.cancel();
  if (audioState.currentId) {
    const oldBtn = document.getElementById('audioBtn-' + audioState.currentId);
    if (oldBtn) { oldBtn.className = 'audio-btn'; oldBtn.innerHTML = '🔊 朗读'; }
  }
  const course = allCourses.find(c => c.id === cid);
  if (!course || !course.content || !window.speechSynthesis) return;
  const text = course.content.replace(/[#>*`_\-|\\]/g, '').replace(/\n+/g, '。').replace(/[「」]/g, '');
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'zh-CN';
  utterance.rate = 0.9;
  utterance.onend = () => {
    audioState = { currentId: null, utterance: null, paused: false };
    if (btn) { btn.className = 'audio-btn'; btn.innerHTML = '🔊 朗读'; }
  };
  utterance.onerror = () => {
    audioState = { currentId: null, utterance: null, paused: false };
    if (btn) { btn.className = 'audio-btn'; btn.innerHTML = '🔊 朗读'; }
  };
  audioState = { currentId: cid, utterance, paused: false };
  window.speechSynthesis.speak(utterance);
  if (btn) { btn.className = 'audio-btn playing'; btn.innerHTML = '⏸ 暂停'; }
}

/* ═══════════════ INIT ═══════════════ */
document.addEventListener('DOMContentLoaded', loadAllCourses);

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
});
</script>

    title:"大一统奠基 — 秦汉帝王",
    desc:"秦始皇统一六国、汉武帝北逐匈奴——中国帝制基本框架的确立",
    tags:["核心","5课时"],
    content:`## 大一统奠基：秦汉帝王\n\n### 一、秦始皇：千古一帝的功与过\n\n公元前221年，秦王嬴政用了十年时间，逐一灭掉韩、赵、魏、楚、燕、齐六国，完成了中国历史上的**第一次大一统**。\n\n**制度创新——郡县制**：废除分封制，全国分为三十六郡，郡下设县，所有官员由中央直接任免，不得世袭。\n\n**文化统一**：书同文（统一文字为小篆）、车同轨（统一车轮间距）、统一度量衡、统一货币（圆形方孔秦半两）。\n\n**北筑长城**：将燕、赵、秦三国旧长城连接起来，西起临洮、东至辽东，绵延万里。\n\n### 二、汉武帝：北逐匈奴的帝国战略\n\n汉武帝刘彻十六岁即位，在位五十四年。他改变了汉初对匈奴的和亲政策，发动了长达四十四年的对匈奴战争。\n\n卫青、霍去病率大军深入漠北。霍去病封狼居胥——汉军最远打到了今天蒙古国的肯特山（狼居胥山）。\n\n> 「匈奴未灭，何以家为？」——霍去病拒绝汉武帝为他建造豪宅。\n\n**丝绸之路**：张骞出使西域，开辟了连接东西方的陆上贸易通道。\n\n**盐铁专卖**：将盐和铁的生产销售收归国有——世界上最早的国企体系之一。\n\n### 三、秦汉帝王的管理学启示\n\n秦始皇和汉武帝共同的历史遗产：**奠定了中国中央集权制度的基本框架**——郡县制、统一文字货币、对北方的战略防御、对西域的经营。此后两千年，无论王朝如何更替，这套治理框架从未被根本改变。`,
    quiz:[
      {q:"秦始皇用多少年灭掉六国？",opts:["5年","10年","15年","20年"],answer:1,explain:"公元前230-221年，嬴政用十年逐一灭掉韩赵魏楚燕齐六国。"},
      {q:"秦始皇废除分封制后推行的是什么制度？",opts:["科举制","三省六部制","郡县制","内阁制"],answer:2,explain:"郡县制：全国分三十六郡，官员由中央任免，不得世袭。这是中国政治史上的划时代创举。"},
      {q:"霍去病的名言是什么？",opts:["天下兴亡匹夫有责","匈奴未灭何以家为","先天下之忧而忧","鞠躬尽瘁死而后已"],answer:1,explain:"霍去病拒绝汉武帝为他建造豪宅时说出此名言，年仅24岁就去世了。"},
      {q:"张骞出使西域开辟了什么？",opts:["海上丝绸之路","茶马古道","丝绸之路","蜀道"],answer:2,explain:"张骞两次出使西域，开辟了连接东西方的陆上贸易通道，促进丝绸、瓷器等贸易。"},
      {q:"汉武帝实行的经济政策是什么？",opts:["自由市场","盐铁专卖","重农抑商","闭关锁国"],answer:1,explain:"盐铁专卖——将盐和铁的生产销售收归国有，世界上最早的国企体系之一。"}
    ]

  {
    id:3,
    title:"分裂与融合 — 魏晋南北朝",
    desc:"三国争霸、淝水之战、北魏孝文帝改革——长达四百年的分裂与民族大融合",
    tags:["进阶","6课时"],
    content:`## 分裂与融合：魏晋南北朝\n\n### 一、三国争霸\n\n东汉末年，天下大乱。曹操「挟天子以令诸侯」，孙权据江东，刘备借荆州。赤壁之战（208年）一把大火烧掉了曹操统一天下的梦想，也烧出了三分天下的格局。\n\n### 二、八王之乱与五胡乱华\n\n西晋统一不到三十年就爆发了宗室自相残杀的「八王之乱」。匈奴、鲜卑、羯、氐、羌五个少数民族趁机南下，北中国陷入长达一百三十多年的战乱。\n\n### 三、淝水之战\n\n公元383年，前秦苻坚率百万大军南征东晋。东晋宰相谢安派谢玄率八万北府兵迎战。\n\n结果八万北府兵大破百万秦军。投鞭断流、草木皆兵、风声鹤唳三个成语都出于此战。\n\n### 四、北魏孝文帝改革\n\n鲜卑人建立的北魏王朝，孝文帝拓跋宏（元宏）做了一个惊世骇俗的决定：**全盘汉化**——迁都洛阳、改汉姓、穿汉服、说汉语、鼓励胡汉通婚。这是世界史上最大规模的由政府主导向先进文化靠拢的改革运动。`,
    quiz:[
      {q:"赤壁之战发生在哪一年？",opts:["200年","208年","220年","230年"],answer:1,explain:"208年赤壁之战，孙刘联军大败曹操，三分天下格局由此确立。"},
      {q:"'投鞭断流'出自哪场战役？",opts:["赤壁之战","官渡之战","淝水之战","夷陵之战"],answer:2,explain:"苻坚号称百万大军'以吾之众旅，投鞭于江，足断其流'，结果八万北府兵大破百万秦军。"},
      {q:"北魏孝文帝的改革核心是什么？",opts:["武力征服","全盘汉化","闭关自守","恢复鲜卑传统"],answer:1,explain:"迁都洛阳、改汉姓（拓跋改为元）、穿汉服、说汉语、鼓励胡汉通婚。"},
      {q:"'挟天子以令诸侯'说的是谁？",opts:["刘备","孙权","曹操","袁绍"],answer:2,explain:"曹操迎汉献帝至许昌，以天子名义号令天下诸侯。"},
      {q:"'风声鹤唳'出自哪场战役？",opts:["赤壁之战","官渡之战","淝水之战","长平之战"],answer:2,explain:"淝水之战秦军溃败，逃跑时听到风声鹤叫都以为是追兵。"}

  {
    id:4,
    title:"盛世巅峰 — 隋唐五代",
    desc:"开皇之治、贞观之治、开元盛世——中国帝制时代的黄金年代",
    tags:["核心","5课时"],
    content:`## 盛世巅峰：隋唐五代\n\n### 一、隋文帝与科举制\n\n隋文帝杨坚结束近三百年的分裂，重新统一中国。他创立的**科举制**——通过考试选拔官员——是中国对世界政治文明最伟大的贡献之一。在此之前，官员选拔靠出身（九品中正制），此后靠能力。\n\n**大运河**：修建了连接南北的大运河，全长约两千七百公里——那个时代世界上最大规模的基础设施工程。\n\n### 二、唐太宗与贞观之治\n\n李世民通过玄武门之变登上皇位。但他证明了夺权的方式不等于治理的水平。\n\n他任用魏征——一个曾为他的敌人效力的人。魏征以犯颜直谏闻名，李世民说：「以铜为镜，可以正衣冠；以古为镜，可以知兴替；以人为镜，可以明得失。魏征死，我失去了一面镜子。」\n\n> 贞观四年，全国被判死刑的仅二十九人。夜不闭户，路不拾遗。\n\n### 三、开元盛世与安史之乱\n\n唐玄宗李隆基用姚崇、宋璟为相，开创了「开元盛世」。长安成为当时世界上最大的城市，常住人口超过百万。李白、杜甫、王维同一时期活跃——中国文学史上最璀璨的时代。\n\n但成也玄宗，败也玄宗。他晚年宠爱杨贵妃，任用杨国忠，纵容安禄山。公元755年，安禄山起兵造反——**安史之乱**爆发。这场持续八年的内战让唐帝国从巅峰跌落。杜甫写道：「国破山河在，城春草木深。」\n\n> **李世民靠制度让庸人也能治国，李隆基靠天才却亲手毁了盛世。**`,
    quiz:[

      {q:"唐太宗的'镜子'比喻指的是谁？",opts:["房玄龄","杜如晦","魏征","长孙无忌"],answer:2,explain:"魏征死，李世民说'我失去了一面镜子'。魏征以犯颜直谏闻名，君臣关系堪称典范。"},
      {q:"安史之乱爆发于哪一年？",opts:["745年","755年","765年","775年"],answer:1,explain:"755年安禄山起兵，持续八年的内战让唐帝国从巅峰跌落。"},
      {q:"'国破山河在，城春草木深'是谁写的？",opts:["李白","王维","杜甫","白居易"],answer:2,explain:"杜甫《春望》写于安史之乱期间，表达了对国破家亡的深切悲恸。"},
      {q:"贞观之治时期全国年死刑人数少到多少？",opts:["约100人","约50人","29人","0人"],answer:2,explain:"贞观四年，全国被判死刑的仅二十九人，反映贞观之治的社会安定程度。"}

  {
    id:5,
    title:"集权巅峰 — 宋元明清",
    desc:"杯酒释兵权、郑和下西洋、康乾盛世——从文治巅峰到专制顶峰",
    tags:["核心","5课时"],
    content:`## 集权巅峰：宋元明清\n\n### 一、赵匡胤与宋朝的文治\n\n公元960年，赵匡胤在陈桥驿被部下「黄袍加身」——被迫当上了皇帝。他做的第一件大事是**杯酒释兵权**——请将领们喝酒，劝他们交出兵权回家享福。\n\n> 「人生如白驹过隙，所求富贵者，不过欲多积金钱，厚自娱乐，使子孙无贫乏耳。卿等何不释去兵权，出守大藩，择便好田宅市之，为子孙立永远不可动之业？」\n\n这是一次罕见的、没有血腥的权力交接。宋朝从此定下了「重文轻武」的国策，三百余年没有发生武将叛乱。代价是军事实力薄弱，始终无法收复燕云十六州。\n\n### 二、成吉思汗与元朝\n\n成吉思汗统一蒙古草原后，建立了人类历史上**疆域最大的陆上帝国**——蒙古帝国。他的孙子忽必烈建立元朝，定都大都（北京）。\n\n> 成吉思汗的军事才能至今被世界军事史公认。但元朝统治不到百年就被推翻——因为蒙元贵族始终没有真正融入中原文化。\n\n马可·波罗正是在元朝来到中国。他的游记让欧洲人第一次知道了东方的富庶——间接刺激了后来哥伦布的远航。\n\n### 三、郑和下西洋\n\n明成祖朱棣派郑和七次下西洋。船队拥有二百多艘船、两万七千多人——当时世界上最大规模的海上远征。最远到达非洲东海岸。\n\n> 郑和船队的宝船据记载长四十四丈、宽十八丈——大约是今天一个标准足球场的大小。\n\n但明宣宗之后，明朝主动放弃了航海事业。半个世纪后，哥伦布才带着三艘小船发现了美洲。**中国错过了大航海时代**。\n\n### 四、康乾盛世\n\n清朝康熙、雍正、乾隆三朝，中国疆域达到极盛——总面积约一千三百万平方公里。人口从明末的约七千万增长到三亿。\n\n但乾隆之后，清朝与世界的差距迅速拉大。当英国工业革命的蒸汽机轰鸣时，清朝还在用牛耕田。乾隆在给英国国王的回信中说：「天朝物产丰盈，无所不有，原不藉外夷货物以通有无。」——两代人的傲慢，换来了一百年的屈辱。`,
    quiz:[
      {q:"'杯酒释兵权'发生在哪个朝代？",opts:["唐朝","宋朝","明朝","清朝"],answer:1,explain:"赵匡胤建宋后以酒宴劝将领交出兵权，是一次罕见的无血腥的权力交接。"},
      {q:"郑和几次下西洋？",opts:["3次","5次","6次","7次"],answer:3,explain:"郑和七次下西洋，船队最远到达非洲东海岸。"},
      {q:"蒙古帝国建立者是谁？",opts:["忽必烈","成吉思汗","窝阔台","拖雷"],answer:1,explain:"成吉思汗统一蒙古草原后建立蒙古帝国，疆域最大的陆上帝国。"},
      {q:"马可·波罗在哪个朝代来到中国？",opts:["宋朝","元朝","明朝","清朝"],answer:1,explain:"马可·波罗在元朝忽必烈时期来到中国，他的游记刺激了欧洲的大航海时代。"},
      {q:"康乾盛世时期中国人口从多少增长到多少？",opts:["5千万到1亿","7千万到3亿","1亿到2亿","5千万到1.5亿"],answer:1,explain:"清朝人口从明末约七千万增长到三亿，农业技术改进和美洲作物引入是主要原因。"}
    ]
  },
  {
    id:6,
    title:"帝制终结 — 晚清到民国",
    desc:"鸦片战争、太平天国、百日维新、辛亥革命——千年帝制的最后一幕",
    tags:["核心","4课时"],
    content:`## 帝制终结：晚清到民国\n\n### 一、鸦片战争\n\n1840年，英国以虎门销烟为借口发动战争。清朝的旧式水师在英国蒸汽铁甲舰面前不堪一击。\n\n《南京条约》割让香港岛、开放五口通商、赔款两千一百万银元——这是中国近代史上第一个不平等条约，也是「百年国耻」的开端。\n\n### 二、太平天国\n\n洪秀全自称耶稣的弟弟，发动了中国历史上规模最大的农民起义。太平天国占据江南半壁江山十四年，定都南京。\n\n> 太平天国运动造成的死亡人数超过三千万——是人类历史上最致命的战争之一。\n\n曾国藩、李鸿章以地方团练起兵，组建了湘军和淮军。这是中国军事史上一个转折——私人军队开始取代国家正规军。\n\n### 三、百日维新\n\n1898年，光绪皇帝在康有为、梁启超辅佐下，推行全面改革——废除科举、建立新式学堂、改革官僚体制。\n\n但变法仅维持了一百零三天就被慈禧太后发动的政变推翻。光绪被囚禁，六君子血洒菜市口。\n\n### 四、辛亥革命\n\n1911年，武昌起义一声枪响，各省纷纷响应。1912年元旦，孙中山在南京就任中华民国临时大总统。2月12日，隆裕太后代宣统帝溥仪颁布退位诏书。\n\n> 延续了两千一百三十二年的中国帝制，正式终结。\n\n**四千年帝制遗产**：从禅让到家天下、从分封到郡县、从九品中正到科举、从闭关到开放……四千年权力实验的核心教训：**制度比人更持久，信任比暴力更有效，开放比封闭更强大。**`,
    quiz:[
      {q:"鸦片战争是哪一年爆发的？",opts:["1839年","1840年","1842年","1856年"],answer:1,explain:"1840年英国以虎门销烟为借口发动鸦片战争，中国近代史的开端。"},
      {q:"太平天国定都在哪里？",opts:["北京","武昌","南京","广州"],answer:2,explain:"洪秀全定都南京（天京），占据江南十四年。"},
      {q:"百日维新维持了多少天？",opts:["30天","50天","103天","200天"],answer:2,explain:"1898年光绪变法仅103天即被慈禧政变推翻，六君子血洒菜市口。"},
      {q:"辛亥革命发生在哪一年？",opts:["1905年","1911年","1912年","1919年"],answer:1,explain:"1911年武昌起义，各省响应。1912年宣统退位，帝制终结。"},
      {q:"中国帝制延续了多少年？",opts:["约1000年","约1500年","约1800年","约2132年"],answer:3,explain:"从秦始皇（前221年）到宣统退位（1912年），中国帝制延续2132年。"}
    ]
