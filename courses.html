// ═══════════════ COURSE DATA ═══════════════
const COURSES = [
  {
    id:1,
    title:"帝制起源 — 从禅让到家天下",
    desc:"夏商周三代：天命观的形成、禅让制到家天下的转变、分封制的逻辑与弊端",
    tags:["入门","3课时","约2.5小时"],
    content:`## 帝制起源：从禅让到家天下

### 一、远古的传说：禅让制的黄金时代

在夏朝建立之前，中国处于传说中的「三皇五帝」时代。那个时代的权力转移采取的是**禅让制**——最高领袖选择最有德行和才能的人来继承帝位，而非传给自己的子孙。

> 尧传舜，舜传禹。不以天下为私产，而以天下付贤者。

尧帝晚年，四方部落推举舜为继承人。尧考察了舜三年——把自己的两个女儿嫁给他，看他如何处理家庭关系；让他到山林中，看他在暴风雨中是否能不迷路。舜通过了所有考验，成为新一代领袖。

舜晚年又用同样的方式考察禹。禹的父亲鲧因治水失败被处死，禹继承父业，用「**疏导**」代替「堵截」的方法，花了整整十三年时间，终于治平了天下洪水。

> 禹三过家门而不入，连妻子生下儿子启，他都没有回去看一眼。

**禅让制的核心逻辑**：天下不是君主的私有财产，而是委托给贤者管理的公共事务。谁最有治理能力，谁就应该掌握权力。

但这里有一个关键问题：大禹之后，为什么变成了**家天下**？

### 二、大禹的转折：从公天下到家天下

大禹治水成功，威望达到顶峰。他受舜禅让后，效仿先例指定了继承人——**伯益**。

但这里出现了中国历史上最重要的一次制度断裂：大禹的儿子**启**，在大禹去世后夺取了权力，杀死了伯益，建立了中国第一个世袭王朝——**夏朝**（约前2070年）。

这是一个悬而未决的历史公案：

- **正统史观**：启是「篡位者」，破坏了禅让的优良传统
- **另一种解读**：大禹在世时已经默许了启的接班。伯益资历太浅，而启多年积累了自己的政治势力

> 《史记》记载：禹荐益於天，而天下诸侯皆去益而朝启——「吾君之子也。」

无论真相如何，从启开始，「**公天下**」变成了「**家天下**」。这一转变影响深远——此后四千年，中国的最高权力几乎都在家族内部传递。

**启之后**：夏朝传了十四代、十七王，延续约四百七十年。**少康中兴**——夏朝第四代君主太康失国后，其曾孙少康联合旧臣成功复国，这是中国历史上第一次王朝复兴。

### 三、夏桀的覆灭与商汤革命

夏朝最后一位君主**桀**，被史书记载为暴君。他宠爱妃子妺喜，据说为了取悦她，撕毁丝绸、建造酒池肉林。

商部落首领**汤**在贤臣伊尹的辅佐下，起兵讨伐夏桀。在鸣条之战中大败夏军，夏桀被流放，夏朝灭亡。

> 《尚书·汤誓》中记载了夏朝百姓的诅咒：「时日曷丧？予及汝皆亡！」——百姓恨桀入骨，宁可与他同归于尽。

**商朝的贡献**：商朝（约前1600年—前1046年）是中国第一个有直接文字记载的王朝。**甲骨文**的发现，让我们第一次能直接「听到」三千多年前中国人的声音——商朝人事无大小都要占卜，把结果刻在龟甲兽骨上。

**天命观的形成**：商朝人相信他们能统治天下是因为获得了「天」的授权。周武王伐纣时，打出「**天命转移**」的旗号——「天命靡常，惟德是依」。天命不是固定给某一个家族的，只会眷顾有德行的君主。这一观念成为此后中国政治哲学的核心支柱。

### 四、周朝的分封制：制度设计的两面性

周武王灭商后，面对一个巨大的治理难题：如何管理如此广阔的疆域？

他设计了**分封制**：

- **天子**：天下共主，拥有最高的祭祀权和军事指挥权
- **诸侯**：受封土地和人民，在封国内享有独立的军政大权。向天子纳贡、派兵
- **卿大夫**：诸侯国内再次分封，形成金字塔式的贵族体系

**短期优势**：
- 快速扩张——周朝仅用数十年就将势力推进到长江流域
- 因地制宜——各地诸侯根据本地情况灵活治理

**长期弊端**：
- 诸侯坐大，天子架空——平王东迁后，周天子沦为名义上的共主
- 春秋战国五百年分裂——诸侯国之间无休止的兼并战争
- 制度性矛盾——分封制给予诸侯独立性，却又要求他们忠诚于天子

### 五、暴君叙事：一个贯穿帝制史的模式

夏桀被中国正史列为第一个暴君，商纣紧随其后——「桀纣」并称，成为暴君的代名词。

但近年有学者提出：**「桀纣」的形象可能被周朝刻意妖魔化，以论证自己革命（以周代商）的合法性。**

> 周朝需要回答一个问题：臣子讨伐君主，在道德上如何正当？答案就是——把前朝末代君主描述得十恶不赦，让革命变成「替天行道」。

这一模式——「前朝末代君主一定是昏君暴君」——几乎贯穿了整个中国帝制史。秦二世、隋炀帝、崇祯……几乎每个朝代的末代皇帝在史书中都被描写得特别糟糕。**这真的是巧合吗？还是胜利者书写历史时的必然选择？**

    content:`## 大一统奠基：秦汉帝王

### 一、秦始皇：千古一帝的功与过

公元前221年，秦王嬴政用了十年时间，逐一灭掉韩、赵、魏、楚、燕、齐六国，完成了中国历史上的**第一次大一统**。

这不是简单的军事征服。秦始皇要解决的核心问题是：六国已经习惯了各自独立的文化和制度，如何让它们成为一个统一的国家？

**制度创新——郡县制**：
秦始皇做了一个划时代的决定：废除分封制，全面推行**郡县制**。全国分为三十六郡，郡下设县，所有官员由中央直接任免，不得世袭。

> 这意味着地方官员不再是「领主」，而是中央的「雇员」。权力牢牢掌握在皇帝一人手中。这是中国政治史上前所未有的集权实验。

**文化统一——书同文、车同轨**：
- 废除六国各自的文字，以秦国的小篆为全国通用文字
- 统一车轮间距，修建驰道——古代的高速公路网络
- 统一度量衡——全国的斗、秤、尺全部标准化
- 统一货币——圆形方孔的秦半两通行全国

**北筑长城**：
将燕、赵、秦三国的旧长城连接起来，西起临洮、东至辽东，绵延万里。动用民夫数十万。

**功与过的矛盾**：

| 功绩 | 过失 |
|------|------|
| 废分封，行郡县——中央直管 | 焚书坑儒——思想专制 |
| 统一文字、度量衡、货币 | 严刑峻法——「赭衣塞路，囹圄成市」 |
| 修驰道、凿灵渠 | 过度役使——长城、阿房宫、骊山陵 |

> 秦始皇的核心矛盾：他创造了中国历史上最伟大的制度创新，却也用最残酷的手段推行它。**功在千秋，罪在当代。**

**秦二世而亡**：
秦始皇死后，赵高和李斯篡改遗诏，扶持昏庸的胡亥（秦二世）继位。在赵高的操纵下，秦二世屠戮兄弟姐妹、诛杀功臣，朝政混乱。仅仅三年后——公元前209年——陈胜吴广在大泽乡揭竿而起。

> 「王侯将相，宁有种乎？」——这句话成为中国历史上所有底层反抗者的精神旗帜。

秦朝仅十五年便土崩瓦解。它的教训是：**再伟大的制度，如果失去民心，也无法持久。**

### 二、刘邦：布衣天子的用人之道

刘邦出身低微，做过泗水亭长——大约相当于今天的乡镇派出所所长。他是中国历史上第一个**平民皇帝**。

**楚汉争霸**：
刘邦与项羽争夺天下的四年，是中国历史上最戏剧性的一段。项羽勇冠三军，力能扛鼎，却刚愎自用；刘邦看似无能，但知人善任。垓下之战，韩信以「四面楚歌」瓦解楚军士气，项羽在乌江自刎。

> 「力拔山兮气盖世，时不利兮骓不逝。骓不逝兮可奈何，虞兮虞兮奈若何！」——项羽的绝唱，千古悲歌。

**刘邦的用人之道——自我总结**：
他在一次宴会上总结自己成功的原因：

- 「运筹帷幄之中，决胜千里之外，吾不如**子房**（张良）」
- 「镇国家，抚百姓，给馈饷，不绝粮道，吾不如**萧何**」
- 「连百万之军，战必胜，攻必取，吾不如**韩信**」
- 「此三者皆人杰也，**吾能用之**，此吾所以取天下也」

> **领导力的核心**：不是自己最强，而是能用最强的人。项羽手下只有一个范增却不能用，刘邦手下人才济济皆尽其用——胜负早已注定。

**白登山之围与黄老之治**：
刘邦称帝后曾在白登山被匈奴围困七天七夜，几乎全军覆没。此后的**汉文帝和汉景帝**采取「**黄老之学**」——无为而治、休养生息、不轻易对外用兵。这就是著名的**文景之治**。

> 《史记》记载：「京师之钱累巨万，贯朽而不可校。太仓之粟陈陈相因，充溢露积於外，至腐败不可食。」——轻徭薄赋四十年，国家财富迅速积累。

### 三、汉武帝：塑造「汉」民族的帝王

汉武帝刘彻十六岁即位，在位五十四年。他的决策，至今影响着我们的生活。

**北逐匈奴——确立生存空间**：
汉武帝一改前代的防御姿态，主动出击匈奴。卫青、霍去病率领汉军深入漠北，封狼居胥山——这是汉人军事辉煌的顶点。

> 霍去病说：「**匈奴未灭，何以家为？**」

从匈奴的威胁中突围，汉民族确立了自己的生存疆域。直到今天，「汉」仍然是我们民族的名称。

**张骞通西域——开辟丝绸之路**：
张骞出使西域最初是军事目的——联合大月氏夹击匈奴。但他在西域的见闻打开了中国人的世界视野。此后，丝绸、瓷器、茶叶通过这条商路运往西方，葡萄、石榴、胡桃、胡麻传入中国。

**独尊儒术——确立意识形态**：
武帝采纳董仲舒的建议——「罢黜百家，**独尊儒术**」。从此儒学成为中国的官方意识形态，影响了此后两千年的政治、教育和伦理体系。科举考试以儒家经典为核心内容，直到1905年才废止。

**推恩令——不动声色的削藩**：
汉武帝面对诸侯王势力过大的问题，发布了「推恩令」：诸侯王的封地不再由嫡长子一人继承，而是由**所有儿子均分**。这一政策的精妙之处在于——诸侯王没有任何理由反对（让所有儿子受益），但几代之后封地越分越小，诸侯势力自然瓦解。

**晚年的悲剧——巫蛊之祸**：
汉武帝晚年多疑，宠臣江充诬告太子刘据用巫蛊诅咒皇帝。太子被迫起兵自卫，兵败被杀，牵连数万人。事后武帝追悔莫及，在轮台发布《**轮台罪己诏**》，公开承认自己穷兵黩武、劳民伤财的过失。

> 这是中国历史上第一个皇帝公开进行自我批评。帝王认错，何其罕见。但这份觉悟来得太晚了。

从秦始皇到汉武帝，中国帝制的基本框架——中央集权、郡县制、儒家意识形态——全部确立。此后两千年，不论王朝如何更替，这一框架从未改变。`,

    content:`## 帝国巅峰：隋唐帝王

### 一、隋文帝：结束三百年分裂的制度设计师

公元581年，杨坚逼迫北周静帝禅让，建立隋朝。八年后的589年，隋军渡过长江，灭掉陈朝，**结束了自西晋灭亡以来近三百年的分裂**。

杨坚最伟大的贡献不在军事，而在制度设计。

**三省六部制**——中国古代政治制度的巅峰设计：
- **中书省**——负责起草政令（决策）
- **门下省**——负责审核政令（监督）
- **尚书省**——负责执行政令（行政）
- 尚书省下设**六部**：吏、户、礼、兵、刑、工

> 权力分立、相互制衡——这套体系一直沿用到清朝末年。在西方孟德斯鸠提出「三权分立」的一千年前，中国已经建立了一套精密的权力制衡机制。

**科举制——一场无声的革命**：
隋文帝创立的科举制，打破了自魏晋以来**门阀士族**对政治权力的垄断。

此前，做官靠的是出身。九品中正制下，「上品无寒门，下品无士族」——出身决定命运。科举制让平民通过考试进入官场，「朝为田舍郎，暮登天子堂」不再只是梦想。

> 此后一千三百年间，无数寒门子弟通过科举改变命运。这是中国历史上最持久、最深刻的社会流动机制。

**开皇之治**：杨坚在位期间轻徭薄赋、整顿户籍，国家财富急剧增长。据《资治通鉴》记载，到隋朝灭亡时仓库里的粮食和布帛堆积如山，唐朝建立后的二三十年里还在使用隋朝留下的储备。

### 二、隋炀帝：被妖魔化的理想主义者

杨广是隋文帝的次子，通过阴谋手段取代兄长杨勇成为太子。他的统治，堪称中国历史上最戏剧性的悲剧。

**三大壮举**：

1. **大运河**——连接南北五大水系，全长约两千七百公里。直到今天，京杭大运河仍在发挥航运作用
2. **东征高句丽**——三次大规模远征，动用兵力超过百万
3. **营建东都洛阳**——建设了一座宏伟的新都城

每一项都是宏大构想。但杨广的问题是——**他同时做了所有事情**。

> 大运河连接南北，造福此后千年。但他在极短时间内强征百万民夫，死者枕藉。他完成的伟大工程，却用了最残酷的手段。

**最后的画面**：
618年，禁军将领宇文化及发动政变，缢杀杨广。据说杨广死前对镜感叹：「好头颅，谁当斫之？」——自负与悲凉交织。

> 历史评价长期两极分化：有人说他是「暴君」，有人说他是「被误解的改革家」。他的大运河、科举完善、西域经略，都为唐朝盛世奠定了基础。但如果他没有透支民力，隋朝会不会延续更久？这是一个永远没有答案的历史假设。

### 三、唐太宗：贞观之治的密码

李世民是中国历史上最受推崇的皇帝之一，但他的皇位来路不正——他是通过**玄武门之变**杀兄逼父上位的。

**玄武门之变**（公元626年）：
李世民在玄武门设伏，杀死兄长李建成和弟弟李元吉，随即派兵进入宫中，迫使父亲李渊退位。这成为他一生的阴影。

> 他用此后二十三年的治世来弥补这一天的罪孽。贞观之治，某种程度上是李世民对自己罪行的救赎。

**治理哲学——四句话**：

1. **以铜为镜，可以正衣冠**
2. **以史为镜，可以知兴替**
3. **以人为镜，可以明得失**
4. **水能载舟，亦能覆舟**

**史上最强管理团队**：
- **房玄龄**——善於谋划，被称为「房谋」
- **杜如晦**——善於决断，「房谋杜断」成为中国成语
- **魏征**——以直谏闻名，当面让皇帝难堪

> 魏征死后，李世民痛哭：「以铜为镜……以人为镜，可以明得失。魏征没，朕亡一镜矣！」

**天可汗**：
贞观四年（630年），唐军击败东突厥，北方各族尊称李世民为「**天可汗**」——既是汉人的皇帝，也是草原民族的大汗。这是中国历史上少有的双重合法性。

**纳谏——权力自觉的边界**：
李世民最难得的是——他手握绝对权力，却刻意对自己的权力设限。他主动征求谏言，甚至在魏征当众顶撞他时压下怒火。因为他知道：**一个人做决策，一定会出错。**

> 权力的自觉——这可能是帝王学中最高深、最稀缺的品质。

### 四、武则天：唯一的例外

公元690年，六十七岁的武则天正式称帝，改国号为「**周**」。她是中国历史上**唯一的女性皇帝**。

**非常规的上位之路**：
武则天十四岁入宫，成为唐太宗（李世民）的才人。太宗死后，她按惯例出家为尼，却被太宗的儿子唐高宗李治接回宫中。此后她一步步清除所有障碍——王皇后、萧淑妃、长孙无忌——所有挡在她面前的人都被她清除。

**统治术的精妙**：
- **扩大科举，提拔寒门**——狄仁杰、姚崇、张说都是从她的时代崛起的
- **设立铜匦（告密系统）**——鼓励百姓举报，以恐怖手段打击政敌
- **任用酷吏如来俊臣，但用完即杀**——用完的工具不会留下把柄

**无字碑**：
武则天死后，与唐高宗合葬於乾陵。她立了一块巨大的石碑，上面**空无一字**。

> 「功过是非，任后人评说。」——不自己写，也不让别人替她写。这是中国历史上前所未有的自信。

武则天的统治充满争议。但史学界逐渐形成共识：她延续并发展了贞观之治，为开元盛世奠定了基础。她提拔的寒门人才，正是后来开元盛世的核心班底。

### 五、唐玄宗：同一个人的两张面孔

中国历史上很难找到另一个皇帝，像唐玄宗李隆基这样——同一个人的前后半生，呈现出如此极端的两张面孔。

**前半生：开元盛世（713—741）**
李隆基在武则天去世后的政变乱局中崛起，先后铲除了**韦后集团**（他的伯母）和**太平公主集团**（他的姑母），夺取政权。

开元年间，他励精图治：
- 任用姚崇、宋璟、张九龄等贤相
- 整顿吏治，精简机构
- 长安成为当时世界上最繁荣的城市，人口超过一百万

> 杜甫《忆昔》：「忆昔开元全盛日，小邑犹藏万家室。稻米流脂粟米白，公私仓廪俱丰实。」

**后半生：安史之乱（755—763）**
一切在天宝年间急转直下：
- 沉迷杨贵妃，不理朝政——「春宵苦短日高起，从此君王不早朝」
- 信任安禄山——一个肥胖的胡人将领，甚至收为义子
- 重用李林甫、杨国忠——堵塞言路，奸臣当道

公元755年，安禄山在范阳起兵叛乱。**安史之乱**持续八年，死亡人数超过三千万——按当时人口比例来算，是人类历史上最惨烈的战争之一。唐朝从此由盛转衰。

> 同一个皇帝，同一个国家，同一套制度。转变的不是制度，是**人**。当掌握绝对权力的人失去了自我约束，再好的制度也无能为力。

    content:`## 文治的博弈：宋元帝王

### 一、赵匡胤：最温柔的夺权者

公元960年正月初一，边关急报：辽国联合北汉大举南侵。后周朝廷仓促之下派殿前都点检赵匡胤率军北上御敌。

大军走到开封城东北二十里的陈桥驿时天降大雪。当晚赵匡胤的部下开始议论：当今皇帝只有七岁，我们在前线拼命他知道吗？不如立点检做天子。

第二天一早，赵匡胤醒来时，一件黄袍已经披在他身上。将士们跪地山呼万岁。赵匡胤推辞再三之后说：你们贪图富贵立我为天子。但必须答应我三件事：回开封后不得惊犯太后和幼主，不得欺凌公卿大臣，不得抢掠府库。从命者有赏，违者灭族。

大军回到开封时秋毫无犯。赵匡胤和平接管了政权。七岁的小皇帝柴宗训禅位。赵匡胤在《即位赦文》中特别强调：柴氏子孙有罪不得加刑，即使谋反也只许在狱中赐尽——这在历朝历代是独一无二的仁慈。

**但夺取政权容易，守住政权需要解决一个根本问题：如何防止别人也披上黄袍？**

### 二、杯酒释兵权：历史性的和平削权

建隆二年七月的某个夜晚，赵匡胤把石守信、高怀德等禁军高级将领请来喝酒。

酒过三巡，赵匡胤突然叹气：没有你们就没有我的今天。但做天子太难了——整夜睡不着觉。

将领们忙问为什么。赵匡胤说：这还不明白吗？这个位子谁不想坐？

众将大惊跪地：天下已定谁敢有二心？

赵匡胤说了一段掏心窝子的话：「卿等固然忠心。但你们的部下如果把黄袍披在你们身上，你们虽然不想干，还由得了你们吗？」

将领们吓出一身冷汗，请求指示生路。

赵匡胤说出了他的方案：「人生如白驹过隙。你们不如交出兵权，到地方上去做节度使，多买良田美宅留给子孙，养些歌儿舞女安度晚年。我再与你们结为儿女亲家。这样君臣之间上下相安，不是很好吗？」

第二天，禁军将领们纷纷称病请求辞职。赵匡胤一一批准，赏赐优厚。石守信去当天平军节度使，高怀德去当归德军节度使——有职无权，富贵终身。

没有流血，没有杀戮。一场历史上最温和的权力交接完成了。

**但杯酒释兵权有代价**。从此宋朝形成了重文轻武的国策。赵匡胤亲口说过：「朕今选儒臣干事者百余，分治大藩。纵使皆贪浊，亦未及武臣一人也。」——就算一百个文官贪污，危害也比不上一个武将造反。

这个政策导致军队战斗力严重下降。宋朝军费占财政总支出的80%以上，养兵百万，但在对辽、西夏、金的战争中屡战屡败。这是「杯酒释兵权」的另一面——它防止了内部叛乱，但也削弱了抵御外敌的能力。

### 三、宋仁宗：最仁慈的皇帝

赵祯是宋朝第四位皇帝，在位四十二年。他在中国民间知名度可能不高，但他治下的朝代是中国文化史上最辉煌的时期之一。

他去世时，消息传到辽国后，辽道宗耶律洪基握着使者的手痛哭：「四十二年不识兵革矣！」

仁宗朝诞生了中国文化史上最集中的一批巨星：

- 包拯：铁面无私的「包青天」，传说他弹劾过仁宗的岳父
- 范仲淹：「先天下之忧而忧，后天下之乐而乐」
- 欧阳修：文坛领袖，唐宋八大家之一
- 苏轼苏辙兄弟
- 王安石和司马光——这两个后来的政敌当时都是仁宗朝的年轻官员
- 沈括：写出《梦溪笔谈》的全才科学家

**唐宋八大家中，有六位活跃在仁宗朝。**

仁宗以节俭和仁慈著称。有一天夜里他想吃烤羊肉，但想到御厨会因此杀羊劳费，硬是忍住了。大臣包拯在朝堂上慷慨陈词唾沫星子飞到他脸上，他一边擦脸一边接受建议。谏官王素批评他收了地方官进献的美女——他立即把美女全部遣送回家。

### 四、王安石变法与司马光：理想与保守的碰撞

神宗即位后重用王安石，开始了宋朝最大规模的改革——熙宁变法。

王安石变法的核心逻辑完全正确：当时宋朝财政困难军队庞大而战斗力低下。解决问题的方案是富国强兵：

- 青苗法：官府在青黄不接时贷款给农民收低利息——替代高利贷
- 免役法：百姓可以交钱代替劳役——解放劳动力
- 保甲法：农村组织民兵——节省军费

这些政策在理论上无懈可击。但执行中完全走样：青苗法变成了强制贷款，为了完成指标官员逼迫不需要贷款的富户借贷，到期还不上就进监狱。免役法变成了变相加税。

**核心教训：好政策，坏执行。政策设计者的智商不能替代基层执行者的素质。**

司马光强烈反对变法。他的理由是：天下财富是固定的，政府多收老百姓就少得。与其折腾不如保持稳定。

两人的争论是真诚的——他们都是为国家好。王安石回朝后没有杀司马光（不像某些朝代异见者就被清洗），司马光也只是在洛阳安心写他的《资治通鉴》。神宗死后司马光执政废除了全部新法——矫枉过正，把新法中有用的部分也废掉了。

### 五、忽必烈与元朝：草原帝国如何统治农耕文明

1271年，忽必烈建立元朝定都大都（今北京）。他是成吉思汗的孙子，统一中国的蒙古大汗。

忽必烈面临一个前所未有的管理难题：如何用草原游牧民族的治理方式管理一个农业文明社会？

他尝试做了一个折中：在军事上保持蒙古传统——蒙古军队不汉化保持骑兵优势；在行政上采用汉制——设立中书省、推行科举（虽然录取很少的汉人）；在文化上多元包容——忽必烈本人信奉藏传佛教但对儒生道士也都礼遇。

马可·波罗在忽必烈时期来到中国。他的游记让欧洲人第一次知道在遥远的东方有一个叫「契丹」（Cathay）的富庶帝国。他描写大都的宏伟繁华——每天有一千辆运丝车进城——这在西方引起了巨大的震撼。

但元朝的根本矛盾没有解决。蒙古贵族不愿汉化，坚持着游牧生活方式。汉人士大夫阶层被排除在核心权力之外心怀不满。加上中后期的皇位继承混乱——忽必烈死后四十年间换了八个皇帝——元朝始终没有建立起稳定的治理体系。

**元朝的启示**：征服一个国家容易，治理一个国家需要制度。蒙古人用不到一百年就退回草原——制度比武力更持久。`,

    content:`## 专制巅峰：明清帝王

### 一、朱元璋：从乞丐到皇帝的集权实验

朱元璋是中国历史上起点最低的皇帝。他出生在濠州钟离一个赤贫农家，排行老八，父母和三个兄长都在一场瘟疫中饿死。十七岁的朱元璋无家可归，到皇觉寺当了和尚。但寺庙也养不起他，他外出云游化缘三年——实际上就是乞讨。

二十五岁那年他投奔了红巾军。仅仅十五年后的1368年，四十岁的朱元璋在应天（南京）称帝建立了明朝。

他是天才的军事家。他采取高筑墙广积粮缓称王的稳健策略，先取陈友谅再灭张士诚最后北伐元朝——战略顺序精妙绝伦。

但建国后朱元璋做了一件影响中国此后五百年的事：废除了丞相制度。

洪武十三年，朱元璋以宰相胡惟庸谋反为由将其处死。他宣布：从此永远废除丞相之职，六部直接向皇帝汇报。

背后的逻辑简单而可怕：他不信任任何人。他要亲自掌控一切。此后朱元璋每天批阅数百份奏折。据记载他平均每天处理400多件政务，每件都要亲自批示。

**废除丞相的长期后果**：权力完全集中在皇帝一人之手。此后的明朝皇帝要么像朱元璋朱棣一样累死累活，要么像万历一样躲在后宫几十年不上朝——因为没有丞相系统可以分担和制衡。清朝虽然名义上有内阁和军机处，但决策权从未离开皇帝。

### 二、永乐大帝朱棣与郑和下西洋

朱棣是朱元璋第四子。侄儿建文帝削藩逼反了他。他发动靖难之役从北平起兵三年后攻入南京。

朱棣做了几件影响深远的事：
- 迁都北京：把大本营从南京搬到北方前线，奠定了北京此后作为首都的地位
- 五次亲征漠北打击蒙古残余势力
- 派郑和七下西洋

郑和七下西洋是中国古代航海技术登峰造极的体现。最大的一次船队有200多艘船、27000多人。最大的宝船长约150米——当时世界上最大的木船。郑和到达了东南亚、印度、阿拉伯半岛、非洲东海岸。

但朱棣一死，航海立即停止。此后的明朝皇帝不仅不发展了——连郑和的航海档案都被兵部侍郎刘大夏销毁了。他说：三宝太监下西洋耗资巨大对国家无益。从此中国从世界海洋上退出。

**郑和下西洋是明朝最辉煌的时刻之一，也是最令人扼腕的错失——如果持续海外探索，世界近代史的格局可能完全不同。**

### 三、康熙：千古一帝的光与影

康熙八岁即位十四岁智擒鳌拜亲政。他是中国历史上知识最渊博的皇帝之一：

- 精通满语汉语蒙古语，还能阅读拉丁文数学著作
- 师从比利时传教士南怀仁学习几何天文学和弹道学
- 亲自用几何方法测量永定河堤坝的长度

他的功业也是一流的：
- 十六岁铲除权臣鳌拜
- 平定三藩之乱（八年）
- 派施琅收复台湾
- 三次亲征噶尔丹
- 签订《尼布楚条约》划定中俄边界

但康熙晚年犯了一个致命的错误：没有解决好继承人问题。

康熙废黜太子胤礽两次。九个皇子各自结党争储——九子夺嫡。皇子们明争暗斗互相倾轧。康熙对此心知肚明却无力制止。晚年他在诏书中流露出深深的疲惫和无奈。

**康熙的悲剧**：一个才华横溢的皇帝到了晚年却在儿子们的争斗中束手无策。他建立了强大的帝国但无法保证权力的平稳交接。

### 四、雍正：最孤独的勤政者

雍正在九子夺嫡的腥风血雨中胜出。但关于他的继位一直有争议——是康熙遗诏真传还是他篡改遗诏？

const KEY='mandate_learn_v1';
let state=loadState();

function loadState(){
  try{
    const s=localStorage.getItem(KEY);
    if(s) return JSON.parse(s);
  }catch(e){}
  return {completed:[],scores:{},current:1,totalCorrect:0,streak:0};
}
function saveState(){localStorage.setItem(KEY,JSON.stringify(state));}

// ═══════════════ RENDER ═══════════════
function render(){
  const map=document.getElementById('courseMap');
  map.innerHTML='';

  COURSES.forEach((c)=>{
    const isCompleted=state.completed.includes(c.id);
    const isCurrent=c.id===state.current;
    const isLocked=!isCompleted && !isCurrent;
    const score=state.scores[c.id];
    const hasScore=score!==undefined;

    const node=document.createElement('div');
    node.className='c-node'+(isCompleted?' completed':'')+(isCurrent?' current':'')+(isLocked?' locked':'');
    node.id='course-'+c.id;

    const statusText=isCompleted?'✓ 已通过':isLocked?'🔒 未解锁':'▶ 学习中';
    node.innerHTML=`
      <div class="c-node-header" onclick="toggleCourse(${c.id})">
        <div class="c-num">${isCompleted?'✓':c.id}</div>
        <div class="c-info">
          <h3>${c.title}</h3>
          <p>${c.desc}</p>
          <div class="c-tags">${c.tags.map(t=>`<span class="c-tag">${t}</span>`).join('')}${hasScore?`<span class="c-tag" style="color:var(--green)">得分 ${score}/${c.quiz.length}</span>`:''}</div>
        </div>
        <div class="c-status">${statusText}</div>
      </div>
      <div class="c-body">
        <div class="c-content">
          <button class="audio-btn" id="audioBtn-${c.id}" onclick="toggleAudio(${c.id})" title="朗读课程内容">🔊 朗读</button>
          <div class="md">${parseMd(c.content)}</div>
          ${renderQuiz(c,isCompleted,hasScore)}
        </div>
      </div>
    `;
    map.appendChild(node);
  });

  updateStats();
}

function renderQuiz(c,isCompleted,hasScore){
  if(isCompleted && hasScore){
    return `
      <div class="quiz-section">

  c.quiz.forEach((q,qi)=>{
    html+=`<div class="quiz-q" id="q-${c.id}-${qi}">

        `).join('')}
      </div>
      <div class="quiz-explain" id="exp-${c.id}-${qi}"></div>

      <div class="quiz-score">已答：<span class="num" id="answered-${c.id}">0</span>/${c.quiz.length}</div>
      <div class="quiz-actions">
        <button class="btn btn-primary" id="submitBtn-${c.id}" onclick="submitQuiz(${c.id})" disabled>提交答卷</button>

    </div></div>`;

}

// ═══════════════ MARKDOWN PARSER ═══════════════
function parseMd(md){
  return md
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^#### (.+)$/gm,'<h4>$1</h4>')
    .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/<p><\/p>/g,'')
    .replace(/<p>(<h[234]>)/g,'$1').replace(/(<\/h[234]>)<\/p>/g,'$1')
    .replace(/<p>(<blockquote>)/g,'$1').replace(/(<\/blockquote>)<\/p>/g,'$1')
    .replace(/<p><li>/g,'<ul><li>').replace(/<\/li><\/p>/g,'</li></ul>')
    .replace(/<\/ul><ul>/g,'');
}

// ═══════════════ QUIZ LOGIC ═══════════════
let quizAnswers={};

function selectOpt(ci,qi,oi){
  const qEl=document.getElementById(`q-${ci}-${qi}`);
  if(qEl.classList.contains('answered-correct')||qEl.classList.contains('answered-wrong')) return;

  if(!quizAnswers[ci]) quizAnswers[ci]={};
  quizAnswers[ci][qi]=oi;

  const opts=qEl.querySelectorAll('.quiz-opt');
  opts.forEach((o,i)=>o.classList.toggle('selected',i===oi));

  const answered=Object.keys(quizAnswers[ci]).length;
  const el=document.getElementById('answered-'+ci);
  if(el) el.textContent=answered;

  const c=COURSES.find(x=>x.id===ci);
  const btn=document.getElementById('submitBtn-'+ci);
  if(btn) btn.disabled=answered<c.quiz.length;
}

function submitQuiz(ci){
  const c=COURSES.find(x=>x.id===ci);
  const answers=quizAnswers[ci]||{};
  let correct=0;

  c.quiz.forEach((q,qi)=>{
    const userAns=answers[qi];
    const qEl=document.getElementById(`q-${ci}-${qi}`);
    const expEl=document.getElementById(`exp-${ci}-${qi}`);
    const opts=qEl.querySelectorAll('.quiz-opt');

    opts.forEach(o=>o.classList.add('disabled'));

    if(userAns===q.answer){
      correct++;
      qEl.classList.add('answered-correct');
      opts[userAns].classList.add('correct');
      expEl.className='quiz-explain show correct-explain';
      expEl.innerHTML='✓ 正确 — '+q.explain;
    }else{
      qEl.classList.add('answered-wrong');
      if(userAns!==undefined) opts[userAns].classList.add('wrong');
      opts[q.answer].classList.add('correct');
      expEl.className='quiz-explain show wrong-explain';
      expEl.innerHTML='✗ 正确答案是 '+['A','B','C','D'][q.answer]+' — '+q.explain;
    }
  });

  state.scores[ci]=correct;
  state.totalCorrect=Object.values(state.scores).reduce((a,b)=>a+b,0);

  const passed=correct>=Math.ceil(c.quiz.length*0.6);

  if(passed){
    if(!state.completed.includes(ci)){
      state.completed.push(ci);
      state.streak++;
      if(ci<COURSES.length) state.current=ci+1;
    }
    showConfetti();

    const nextC=COURSES.find(x=>x.id===ci+1);
    const banner=document.createElement('div');
    banner.className='next-banner show';
    banner.innerHTML=nextC?
      `<h4>🎉 恭喜通过！</h4>
       <p>你答对了 <strong>${correct}/${c.quiz.length}</strong> 题，下一课已解锁：</p>
       <p class="next-title">第${nextC.id}课：${nextC.title}</p>
       <button class="btn btn-green" onclick="toggleCourse(${nextC.id});document.getElementById('course-${nextC.id}').scrollIntoView({behavior:'smooth',block:'start'})">进入下一课 →</button>`
      :
      `<h4>🏆 全部完成！</h4>
       <p>你答对了 <strong>${correct}/${c.quiz.length}</strong> 题，已完成全部100门课！</p>
       <p style="color:var(--gold);font-weight:700;font-size:1.1rem;margin-top:8px">恭喜获得「帝王学分析师」认证 👑</p>`;
    document.getElementById('quiz-'+ci).after(banner);
  }

  const btn=document.getElementById('submitBtn-'+ci);
  if(btn){
    btn.outerHTML=passed?
      `<span style="color:var(--green);font-weight:700">✓ 通过 (${correct}/${c.quiz.length})</span>`
      :
      `<button class="btn btn-secondary" onclick="retakeQuiz(${ci})">未通过 (${correct}/${c.quiz.length})，重试</button>`;
  }

  saveState();
  updateStats();
}

function retakeQuiz(ci){
  delete quizAnswers[ci];
  delete state.scores[ci];
  state.completed=state.completed.filter(x=>x!==ci);
  if(state.current>ci) state.current=ci;
  saveState();
  render();
  setTimeout(()=>toggleCourse(ci),100);
}

function toggleCourse(id){
  const node=document.getElementById('course-'+id);
  if(!node||node.classList.contains('locked')) return;
  const wasOpen=node.classList.contains('open');
  document.querySelectorAll('.c-node').forEach(n=>n.classList.remove('open'));
  if(!wasOpen){
    node.classList.add('open');
    setTimeout(()=>node.scrollIntoView({behavior:'smooth',block:'start'}),50);
  }
}

function updateStats(){
  document.getElementById('statCompleted').textContent=state.completed.length;
  document.getElementById('statScore').textContent=state.totalCorrect;
  document.getElementById('statStreak').textContent=state.streak;
  document.getElementById('progressFill').style.width=(state.completed.length/COURSES.length*100)+'%';
}

// ═══════════════ CONFETTI ═══════════════
function showConfetti(){
  const box=document.getElementById('confettiBox');
  const colors=['#e2b64f','#c43a31','#22c55e','#3b82f6','#a78bfa','#f59e0b'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div');
    el.className='confetti';
    el.style.left=Math.random()*100+'%';
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDelay=Math.random()*2+'s';
    el.style.animationDuration=(2+Math.random()*2)+'s';
    box.appendChild(el);
  }
  setTimeout(()=>box.innerHTML='',4000);
}


// ═══════════════ TTS AUDIO ═══════════════
let audioState = { currentId: null, utterance: null, paused: false };
function toggleAudio(cid) {
  const btn = document.getElementById('audioBtn-' + cid);
  // If same course playing, toggle pause
  if (audioState.currentId === cid && audioState.utterance) {
    if (audioState.paused) {
      window.speechSynthesis.resume();
      audioState.paused = false;
      if (btn) { btn.className = 'audio-btn playing'; btn.innerHTML = '⏸ 暂停'; }
    } else {
      window.speechSynthesis.pause();
      audioState.paused = true;
      if (btn) { btn.className = 'audio-btn paused'; btn.innerHTML = '▶ 继续'; }
    }
    return;
  }
  // Stop any previous audio
  window.speechSynthesis.cancel();
  if (audioState.currentId) {
    const oldBtn = document.getElementById('audioBtn-' + audioState.currentId);
    if (oldBtn) { oldBtn.className = 'audio-btn'; oldBtn.innerHTML = '🔊 朗读'; }
  }
  // Get course content text
  const c = COURSES.find(x => x.id === cid);
  if (!c || !window.speechSynthesis) return;
  // Strip markdown for clean speech
  const text = c.content
    .replace(/[#>*`_\-]/g, '')
    .replace(/\n+/g, '。')
    .replace(/[「」]/g, '');
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'zh-CN';
  utterance.rate = 0.9;
  utterance.onend = () => {
    audioState = { currentId: null, utterance: null, paused: false };
    if (btn) { btn.className = 'audio-btn'; btn.innerHTML = '🔊 朗读'; }
  };
  utterance.onerror = () => {
    audioState = { currentId: null, utterance: null, paused: false };
    if (btn) { btn.className = 'audio-btn'; btn.innerHTML = '🔊 朗读'; }
  };
  audioState = { currentId: cid, utterance: utterance, paused: false };
  window.speechSynthesis.speak(utterance);
  if (btn) { btn.className = 'audio-btn playing'; btn.innerHTML = '⏸ 暂停'; }
}

// ═══════════════ INIT ═══════════════
render();
if(state.current<=COURSES.length){
  setTimeout(()=>{
    const node=document.getElementById('course-'+state.current);
    if(node) node.classList.add('open');
  },300);
}
</script>
