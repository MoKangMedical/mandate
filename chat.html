<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帝王群聊 — Mandate</title>
<meta name="description" content="让秦始皇、唐太宗、康熙大帝同群对话！任何话题，历代帝王齐聚一堂，各抒己见。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#09090b;--bg2:#0f0f13;--bg3:#18181b;
  --card:#1c1c21;--card2:#222228;--card3:#2a2a32;
  --border:#27272a;--border2:#3f3f46;
  --text:#fafafa;--text2:#a1a1aa;--text3:#71717a;
  --gold:#e2b64f;--gold2:#f5d98a;
  --red:#c43a31;--blue:#3b82f6;--green:#22c55e;
  --serif:'Noto Serif SC',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --radius:16px;--radius-sm:10px;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}
a{color:inherit;text-decoration:none}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(9,9,11,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-family:var(--serif);font-size:1.2rem;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:8px}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{font-size:0.85rem;color:var(--text2);transition:color .2s;font-weight:500}
.nav-links a:hover,.nav-links a.active{color:var(--gold)}

/* LAYOUT */
.main{max-width:860px;margin:0 auto;padding:80px 24px 40px}

/* HEADER */
.chat-header{text-align:center;padding:20px 0 32px}
.chat-header .badge{display:inline-flex;align-items:center;gap:8px;background:rgba(226,182,79,0.1);border:1px solid rgba(226,182,79,0.2);padding:6px 16px;border-radius:100px;font-size:0.8rem;color:var(--gold);margin-bottom:16px}
.chat-header h1{font-family:var(--serif);font-size:clamp(1.6rem,3.5vw,2.2rem);font-weight:900;margin-bottom:8px}
.chat-header h1 .gold{color:var(--gold)}
.chat-header p{color:var(--text2);font-size:0.95rem}

/* TOPIC INPUT */
.topic-area{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.topic-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;color:var(--text);font-size:1rem;font-family:var(--sans);resize:none;min-height:60px;transition:border-color .3s}
.topic-input:focus{outline:none;border-color:var(--gold)}
.topic-input::placeholder{color:var(--text3)}
.topic-hint{font-size:0.75rem;color:var(--text3);margin-top:8px}
.api-panel{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.api-input{flex:1;min-width:220px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text2);font-size:0.78rem}
.api-input:focus{outline:none;border-color:var(--gold);color:var(--text)}
.api-status{font-size:0.75rem;color:var(--text3)}

/* EMPEROR SELECT */
.emperor-select{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;max-height:200px;overflow-y:auto;padding:8px 0}
.emperor-select::-webkit-scrollbar{width:4px}
.emperor-select::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.emp-chip{padding:6px 14px;border-radius:100px;font-size:0.78rem;font-weight:500;cursor:pointer;transition:all .2s;
  background:var(--card3);color:var(--text3);border:1px solid transparent;user-select:none}
.emp-chip:hover{border-color:var(--border2);color:var(--text2)}
.emp-chip.selected{background:rgba(226,182,79,0.12);border-color:var(--gold);color:var(--gold)}
.emp-chip.auto-selected{background:rgba(196,58,49,0.1);border-color:var(--red);color:var(--red)}

/* ACTIONS */
.actions{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.btn{padding:10px 22px;border-radius:8px;font-weight:600;font-size:0.88rem;border:none;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--gold);color:#000}
.btn-primary:hover{background:var(--gold2);transform:translateY(-1px)}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border2)}
.btn-secondary:hover{border-color:var(--gold);color:var(--gold)}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:#e85d50}

/* CHAT AREA */
.chat-area{display:flex;flex-direction:column;gap:16px;margin-bottom:24px}
.chat-empty{text-align:center;padding:60px 20px;color:var(--text3)}
.chat-empty .icon{font-size:3rem;margin-bottom:12px;opacity:0.5}
.chat-empty h3{font-family:var(--serif);font-size:1.2rem;margin-bottom:8px;color:var(--text2)}
.chat-empty p{font-size:0.9rem}

/* CHAT BUBBLE */
.chat-msg{display:flex;gap:14px;animation:msgIn 0.4s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.chat-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;
  background:linear-gradient(135deg,rgba(226,182,79,0.15),rgba(196,58,49,0.1));border:1px solid rgba(226,182,79,0.15)}
.chat-bubble{flex:1;min-width:0}
.chat-name{font-family:var(--serif);font-size:0.85rem;font-weight:700;color:var(--gold);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.chat-name .dynasty{font-size:0.7rem;color:var(--text3);font-weight:400;font-family:var(--sans)}
.chat-text{background:var(--card);border:1px solid var(--border);border-radius:0 var(--radius) var(--radius) var(--radius);padding:14px 18px;color:var(--text2);font-size:0.92rem;line-height:1.8}
.chat-text p{margin:0}
.chat-msg:nth-child(odd) .chat-text{background:var(--card2);border-color:rgba(226,182,79,0.08)}
.chat-msg.user{justify-content:flex-end}
.chat-msg.user .chat-bubble{max-width:78%;flex:0 1 auto}
.chat-msg.user .chat-name{justify-content:flex-end;color:var(--text2);font-family:var(--sans)}
.chat-msg.user .chat-text{border-radius:var(--radius) 0 var(--radius) var(--radius);background:rgba(226,182,79,0.1);border-color:rgba(226,182,79,0.18);color:var(--text)}
.chat-msg.user .chat-avatar{display:none}

/* LOADING */
.loading-msg{display:flex;align-items:center;gap:10px;padding:16px;color:var(--text3);font-size:0.85rem}
.loading-dots{display:flex;gap:4px}
.loading-dots span{width:6px;height:6px;background:var(--gold);border-radius:50%;animation:dotBounce 1.4s infinite ease-in-out}
.loading-dots span:nth-child(2){animation-delay:0.2s}
.loading-dots span:nth-child(3){animation-delay:0.4s}
@keyframes dotBounce{0%,80%,100%{transform:scale(0.6);opacity:0.4}40%{transform:scale(1);opacity:1}}

/* SUGGESTIONS */
.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.sug-chip{padding:8px 16px;border-radius:100px;font-size:0.8rem;cursor:pointer;transition:all .2s;
  background:var(--card2);border:1px solid var(--border);color:var(--text2)}
.sug-chip:hover{border-color:var(--gold);color:var(--gold);background:rgba(226,182,79,0.05)}

/* FOOTER */
.footer{border-top:1px solid var(--border);padding:32px 0;text-align:center;margin-top:40px}
.footer p{font-size:0.8rem;color:var(--text3)}

@media(max-width:768px){
  .main{padding:72px 16px 32px}
  .chat-avatar{width:36px;height:36px;font-size:1.1rem}
  .chat-text{padding:12px 14px;font-size:0.88rem}
  .topic-input{font-size:0.92rem;padding:12px 14px}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="2" y="4" width="24" height="20" rx="2" stroke="#e2b64f" stroke-width="1.5"/><path d="M2 10h24M2 16h24" stroke="#e2b64f" stroke-width="1"/><circle cx="14" cy="13" r="5" stroke="#c43a31" stroke-width="1.2" fill="none"/></svg>
      Mandate
    </a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="index.html#emperors">帝王录</a>
      <a href="courses.html">课程</a>
      <a href="chat.html" class="active">群聊</a>
    </div>
  </div>
</nav>

<div class="main">
  <div class="chat-header">
    <div class="badge">多人群聊</div>
    <h1>历代帝王<span class="gold">群聊室</span></h1>
    <p>选择一个话题，秦始皇、唐太宗、康熙大帝同台对话。任何话题，畅所欲言。</p>
  </div>

  <!-- SUGGESTIONS -->
  <div class="suggestions" id="suggestions"></div>

  <!-- TOPIC INPUT -->
  <div class="topic-area">
    <textarea class="topic-input" id="topicInput" placeholder="先输入一个问题或话题，例如：如何治理一个长期复杂的组织" rows="2"></textarea>
    <div class="topic-hint">用户每发一条，DeepSeek 会选择一位帝王回应；也可以让帝王之间继续交锋。</div>
    <div class="api-panel">
      <input class="api-input" id="apiInput" placeholder="DeepSeek 后端地址，例如 http://localhost:8003">
      <button class="btn btn-secondary" onclick="saveApiBase()">连接后端</button>
      <span class="api-status" id="apiStatus"></span>
    </div>
  </div>

  <!-- EMPEROR SELECT -->
  <div class="emperor-select" id="emperorSelect"></div>

  <!-- ACTIONS -->
  <div class="actions">
    <button class="btn btn-primary" id="startBtn" onclick="sendUserTurn()">发送给帝王</button>
    <button class="btn btn-secondary" id="continueBtn" onclick="continueChat()" style="display:none">帝王继续交锋</button>
    <button class="btn btn-red" id="autoBtn" onclick="autoChat()">AI自动匹配帝王</button>
    <button class="btn btn-secondary" onclick="clearChat()">清空</button>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area" id="chatArea">
    <div class="chat-empty">
      <div class="icon">Mandate</div>
      <h3>帝王群聊室</h3>
      <p>选择话题，让历代帝王开始对话</p>
    </div>
  </div>
</div>

<footer class="footer">
  <p>Mandate © 2026 · AI模拟历史人物对话 · 仅供娱乐与学习参考</p>
</footer>

<script>
let API_BASE = window.MANDATE_CHAT_API || localStorage.getItem('mandate_chat_api') || (
  ['localhost', '127.0.0.1'].includes(location.hostname) ? 'http://localhost:8003' : location.origin
);
let allEmperors = [];
let selectedEmperors = new Set();
let chatHistory = [];
let activeParticipants = [];
let conversationTopic = '';
let isRequesting = false;

const AVATARS = ['秦','汉','唐','宋','元','明','清','魏','晋','隋','周','楚','赵','燕','齐','梁','陈','辽','金','帝'];
const LOCAL_EMPERORS = [
  '秦始皇','刘邦','项羽','汉武帝','曹操','刘备','诸葛亮','孙权','唐太宗','武则天','唐玄宗','宋太祖','王安石','苏轼','成吉思汗','忽必烈','朱元璋','朱棣','康熙','雍正','乾隆','慈禧','孙中山'
];

const SUGGESTIONS = [
  "做皇帝最重要的是什么？",
  "如果你能穿越到2026年，第一件事做什么？",
  "历史上最被低估的帝王是谁？",
  "治国之道的核心是什么？",
  "如何处理与大臣的关系？",
  "继承人问题为什么这么难？",
  "如何看待战争与和平？",
  "什么是好的制度？",
  "你最大的遗憾是什么？",
  "给现代CEO的一条建议",
];

// Load emperors
async function loadEmperors() {
  initApiPanel();
  if (!API_BASE) {
    loadLocalEmperors();
    return;
  }
  try {
    const resp = await fetch(`${API_BASE}/api/emperors`);
    const data = await resp.json();
    allEmperors = data.emperors;
    renderEmperorChips();
    renderSuggestions();
  } catch(e) {
    console.log('API not available, using local data');
    await loadLocalEmperors();
  }
}

async function loadLocalEmperors() {
  allEmperors = LOCAL_EMPERORS.map(n => ({name: n, preview: ''}));
  renderEmperorChips();
  renderSuggestions();
}

function initApiPanel() {
  const input = document.getElementById('apiInput');
  if (input) input.value = API_BASE || '';
  updateApiStatus();
}

function saveApiBase() {
  const input = document.getElementById('apiInput');
  API_BASE = (input?.value || '').trim().replace(/\/$/, '');
  if (API_BASE) localStorage.setItem('mandate_chat_api', API_BASE);
  else localStorage.removeItem('mandate_chat_api');
  updateApiStatus();
  loadEmperors();
}

function updateApiStatus(text) {
  const el = document.getElementById('apiStatus');
  if (!el) return;
  el.textContent = text || (API_BASE ? `已连接：${API_BASE}` : '需要连接 DeepSeek 后端后才能对话');
}

function renderEmperorChips() {
  const container = document.getElementById('emperorSelect');
  const unique = [];
  const seen = new Set();
  for (const e of allEmperors) {
    if (!seen.has(e.name)) { seen.add(e.name); unique.push(e); }
  }
  container.innerHTML = unique.map((e,i) => {
    const sel = selectedEmperors.has(e.name) ? ' selected' : '';
    return `<span class="emp-chip${sel}" onclick="toggleEmperor('${e.name.replace(/'/g,"\\'")}', this)" data-name="${e.name}">${e.name}</span>`;
  }).join('');
}

function renderSuggestions() {
  document.getElementById('suggestions').innerHTML = SUGGESTIONS.map(s =>
    `<span class="sug-chip" onclick="document.getElementById('topicInput').value='${s}';sendUserTurn()">${s}</span>`
  ).join('');
}

function toggleEmperor(name, el) {
  if (selectedEmperors.has(name)) {
    selectedEmperors.delete(name);
    el.classList.remove('selected');
  } else {
    if (selectedEmperors.size >= 10) {
      alert('最多选择10位帝王参与群聊');
      return;
    }
    selectedEmperors.add(name);
    el.classList.add('selected');
  }
}

function getAvatar(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return AVATARS[Math.abs(hash) % AVATARS.length];
}

function getParticipants() {
  if (selectedEmperors.size > 0) return [...selectedEmperors];
  return ['秦始皇','刘邦','唐太宗','康熙','曹操'];
}

function escapeHTML(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function sendUserTurn() {
  const input = document.getElementById('topicInput');
  const message = input.value.trim();
  if (!message) {
    input.focus();
    return;
  }
  if (!API_BASE) {
    showSystemNotice('请先填写 DeepSeek 后端地址。前端不会保存或暴露 DeepSeek API Key。');
    return;
  }
  if (!conversationTopic) conversationTopic = message;
  activeParticipants = getParticipants();
  input.value = '';
  appendMessage({role: 'user', message});
  await requestEmperorTurn('reply_to_user');
}

async function continueChat() {
  if (!chatHistory.length) {
    showSystemNotice('请先发送一个问题。');
    return;
  }
  if (!API_BASE) {
    showSystemNotice('请先填写 DeepSeek 后端地址。');
    return;
  }
  if (!activeParticipants.length) activeParticipants = getParticipants();
  await requestEmperorTurn('emperor_to_emperor');
}

async function autoChat() {
  const topic = document.getElementById('topicInput').value.trim() || SUGGESTIONS[Math.floor(Math.random()*SUGGESTIONS.length)];
  document.getElementById('topicInput').value = topic;
  selectedEmperors.clear();
  document.querySelectorAll('.emp-chip').forEach(c => c.classList.remove('selected','auto-selected'));
  
  const names = allEmperors.map(e => e.name).filter((v,i,a) => a.indexOf(v)===i);
  const shuffled = names.sort(() => Math.random() - 0.5);
  const autoPick = shuffled.slice(0, 5);
  autoPick.forEach(n => selectedEmperors.add(n));
  
  document.querySelectorAll('.emp-chip').forEach(c => {
    if (autoPick.includes(c.dataset.name)) c.classList.add('auto-selected');
  });

  setTimeout(() => sendUserTurn(), 300);
}

async function requestEmperorTurn(mode) {
  if (isRequesting) return;
  isRequesting = true;
  setButtonsDisabled(true);
  const loadingDiv = appendLoading(mode === 'reply_to_user' ? 'DeepSeek 正在选择帝王回应...' : 'DeepSeek 正在生成下一位帝王发言...');
  try {
    const resp = await fetch(`${API_BASE}/api/turn`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        topic: conversationTopic,
        participants: activeParticipants,
        history: chatHistory,
        mode
      })
    });
    loadingDiv.remove();
    if (!resp.ok) {
      let detail = 'DeepSeek 后端请求失败';
      try {
        const err = await resp.json();
        detail = err.detail || detail;
      } catch (_) {}
      throw new Error(detail);
    }
    const data = await resp.json();
    appendMessage(data.message);
    document.getElementById('continueBtn').style.display = 'inline-flex';
    updateApiStatus('DeepSeek 已完成本轮回应');
  } catch (e) {
    loadingDiv.remove();
    showSystemNotice(e.message || 'DeepSeek 后端暂不可用');
  } finally {
    setButtonsDisabled(false);
    isRequesting = false;
  }
}

function appendMessage(message) {
  const area = document.getElementById('chatArea');
  if (area.querySelector('.chat-empty')) area.innerHTML = '';
  chatHistory.push(message);
  const div = document.createElement('div');
  const isUser = message.role === 'user';
  div.className = `chat-msg${isUser ? ' user' : ''}`;
  div.innerHTML = isUser ? `
    <div class="chat-bubble">
      <div class="chat-name">你</div>
      <div class="chat-text"><p>${escapeHTML(message.message)}</p></div>
    </div>
  ` : `
    <div class="chat-avatar">${escapeHTML(getAvatar(message.emperor))}</div>
    <div class="chat-bubble">
      <div class="chat-name">${escapeHTML(message.emperor)}</div>
      <div class="chat-text"><p>${escapeHTML(message.message)}</p></div>
    </div>
  `;
  area.appendChild(div);
  div.scrollIntoView({behavior:'smooth'});
}

function appendLoading(text) {
  const area = document.getElementById('chatArea');
  if (area.querySelector('.chat-empty')) area.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'loading-msg';
  div.innerHTML = `<div class="loading-dots"><span></span><span></span><span></span></div> ${escapeHTML(text)}`;
  area.appendChild(div);
  div.scrollIntoView({behavior:'smooth'});
  return div;
}

function showSystemNotice(text) {
  const area = document.getElementById('chatArea');
  if (area.querySelector('.chat-empty')) area.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'chat-empty';
  div.innerHTML = `
    <div class="icon">提示</div>
    <h3>需要 DeepSeek 后端</h3>
    <p>${escapeHTML(text)}</p>
  `;
  area.appendChild(div);
  div.scrollIntoView({behavior:'smooth'});
}

function setButtonsDisabled(disabled) {
  document.getElementById('startBtn').disabled = disabled;
  document.getElementById('continueBtn').disabled = disabled;
  document.getElementById('autoBtn').disabled = disabled;
}

function renderMessages(messages) {
  const area = document.getElementById('chatArea');
  area.innerHTML = '';
  chatHistory = [];
  messages.forEach(appendMessage);
  document.getElementById('continueBtn').style.display = chatHistory.length ? 'inline-flex' : 'none';
}

function clearChat() {
  chatHistory = [];
  activeParticipants = [];
  conversationTopic = '';
  document.getElementById('chatArea').innerHTML = `
    <div class="chat-empty">
      <div class="icon">Mandate</div>
      <h3>帝王群聊室</h3>
      <p>选择话题，让历代帝王开始对话</p>
    </div>
  `;
  document.getElementById('continueBtn').style.display = 'none';
}

// Enter to submit
document.getElementById('topicInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendUserTurn();
  }
});

document.addEventListener('DOMContentLoaded', loadEmperors);
</script>

<script src="js/courses-data.js"></script>
</body>
</html>
